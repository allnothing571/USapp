            schema: { $ref: '#/components/schemas/MessageTextRequest' }
      responses:
        '201':
          description: Reply created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/anniversaries:
    post:
      tags: [anniversaries]
      operationId: createAnniversary
      summary: Create a shared anniversary or countdown (P2-2)
      description: |
        Either member creates; a space without a partner may create too. title 1-40 code points
        (task-title rules), date YYYY-MM-DD within 1900-01-01..2199-12-31, kind anniversary|countdown,
        optional note 0-500 code points (task-description rules). The creator is fixed. Same actor/key
        and body replay the original mutation with 200; a different body returns IDEMPOTENCY_KEY_REUSED.
        An unconfirmed commit returns RESULT_UNKNOWN: retry with the same key. Requires Origin and CSRF.
      parameters:
