    get:
      tags: [anniversaries]
      operationId: getHomeAnniversary
      summary: The item for the caller's Home card
      description: |
        pinned (the caller's own pin) > auto (smallest days to the next occurrence or countdown
        target, then created_at, then id) > auto_past (only past countdowns: the most recently
        passed) > none. Selected over the complete current dataset of the space.
      responses:
