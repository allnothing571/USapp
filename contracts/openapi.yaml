    get:
      tags: [anniversaries]
      operationId: listAnniversaries
      summary: Anniversaries of the caller's space in creation order, newest first
      description: |
        Pages in the immutable identity order (created_at DESC, id DESC); edits never move a row.
        Computed fields refer to `as_of_date`, the Beijing civil date of this read. Pass
