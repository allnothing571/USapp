openapi: 3.1.0

info:
  title: USapp API（阶段 0 冻结契约 + 阶段 1 增量）
  version: 0.4.0
  description: |
    阶段 0 只覆盖：登录与会话、注册白名单、情侣空间创建与邀请加入、
    当前用户/空间查询、健康检查、管理后台骨架。

    0.2.0 起为阶段 1 的增量版本：阶段 0 的全部操作、字段与行为保持冻结不变；
    阶段 1 只新增操作。当前新增：`PATCH /api/v1/me`（修改自己的昵称，M1），
    `GET /api/v1/wallet`（只读自己的资产余额，M2-B，0.3.0 起），
    `POST /api/v1/tasks`、`GET /api/v1/tasks`、`GET /api/v1/tasks/{taskId}`
    （一次性任务的发布与读取，M3-B，0.4.0 起；不含完成接口）。

    契约级硬约束（所有实现必须遵守，后续阶段不得放宽）：
    - Web 与 API 同源部署，全部接口只允许来自配置的 PUBLIC_ORIGIN。
    - 正式会话 Cookie 名固定为 `__Host-usapp-session`，属性固定为
      `Secure; HttpOnly; SameSite=Lax; Path=/`，且**不设置 Domain**。
    - 登录前使用短期预认证会话；发送验证码与建立会话同样需要
      预认证会话 + CSRF 令牌 + 精确匹配的 Origin。
    - 所有状态修改请求（POST/PUT/PATCH/DELETE）必须携带
      `X-CSRF-Token`，且请求 `Origin` 必须与 PUBLIC_ORIGIN 完全相等（字符串比较）。
    - 登录成功后必须更换会话标识与 CSRF 令牌。
    - 所有 `/api/**` 响应必须带 `Cache-Control: no-store`，禁止被 Service Worker 缓存。
    - 注册白名单只控制“新账号注册”，不定义任何业务权限。
    - 移除会话（注销）后服务端立即失效会话。

servers:
  - url: https://localhost:8443
    description: 本地同源开发入口（Caddy，自签证书，需负责人手动信任）
  - url: https://usapp.example.invalid
    description: 生产同源入口占位（域名由负责人补充）

tags:
  - name: session
    description: 会话引导、建立与注销
  - name: auth
    description: 邮箱验证码登录
  - name: space
    description: 情侣空间与邀请
  - name: wallet
    description: 当前用户自己的资产（只读）
  - name: tasks
    description: 一次性任务的发布与读取（M3-B；完成与结算不在本版本）
  - name: admin
    description: 管理后台（仅回环 / 受信代理可达）

paths:
  /api/v1/health:
    get:
      tags: [session]
      operationId: getHealth
      summary: 存活探针（无需会话）
      security: []
      responses:
        '200':
          description: 服务存活
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/v1/session:
    get:
      tags: [session]
      operationId: bootstrapSession
      summary: 会话引导（同时是 CSRF 令牌获取入口）
      description: |
        - 若请求携带有效正式会话：返回 `authenticated=true` 与当前用户/空间。
        - 否则建立/复用短期预认证会话（TTL 30 分钟），返回 `authenticated=false`。
        - 任何情况下都返回当前会话绑定的 `csrf_token`。
        - 该接口本身不修改服务端业务状态，因此不要求 CSRF 令牌；但响应 `no-store`。
      security: []
      responses:
        '200':
          description: 当前会话状态
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'

  /api/v1/auth/email-codes:
    post:
      tags: [auth]
      operationId: requestEmailCode
      summary: 发送一次性邮箱验证码
      description: |
        - 需要预认证或正式会话 + CSRF 令牌 + 精确 Origin。
        - 无论目标邮箱是否在白名单、是否已注册，一律返回 202，避免账号枚举。
        - 白名单只决定“该邮箱能否创建新账号”，在验证码校验阶段才产生 403。
        - 同一会话 / 同一邮箱存在发送冷却（`resend_after_seconds`）。
      responses:
        '202':
          description: 已受理（不保证邮件已投递）
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCodeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: 校验验证码并建立正式会话
      description: |
        - 需要预认证会话 + CSRF 令牌 + 精确 Origin。
        - 验证码消费、用户创建/复用、会话轮换必须在同一事务内完成。
        - 成功时更换会话标识与 CSRF 令牌（旧预认证会话被撤销）。
        - 若邮箱未注册且不在白名单：403 `REGISTRATION_NOT_ALLOWED`。
      responses:
        '200':
          description: 登录成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/sessions:
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: 注销当前会话
      description: 需要正式或预认证会话 + CSRF 令牌 + 精确 Origin；服务端立即撤销并清空 Cookie。
      responses:
        '204':
          description: 已注销
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'

  /api/v1/me:
    get:
      tags: [session]
      operationId: getMe
      summary: 当前用户与所属空间
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [session]
      operationId: updateMe
      summary: 修改当前用户自己的昵称（阶段 1 M1）
      description: |
        - 需要正式会话 + CSRF 令牌 + 精确 Origin；预认证会话返回 401。
        - 被修改的用户只取自服务端会话；请求体不能指定目标用户。
          请求体只允许一个字段 `display_name`，出现任何其他字段返回 400。
        - 去掉首尾空白后要求 1～20 个 Unicode 码点；非法 UTF-8、控制字符与换行
          （任何位置）返回 400。昵称允许重复。
        - 昵称更新与审计事件在同一事务内提交，提交确认成功后才返回 200。
        - 成功返回与 `GET /api/v1/me` 相同的 `MeResponse`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 已更新
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      summary: 查询当前用户自己的资产余额（阶段 1 M2-B）
      description: |
        - 需要正式会话；匿名或预认证会话返回 401。不要求 CSRF 令牌。
        - 用户仅取自服务端会话，不接受目标用户参数；尚未加入空间返回 404 SPACE_NOT_FOUND。
        - 同一查询快照读取两种资产的最新流水余额；没有流水时返回 0。
        - 不创建账户、不写入流水或审计，禁止缓存。
      responses:
        '200':
          description: 自己的当前余额
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: 资产查询暂时失败
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: 给同一空间的另一成员发布一次性任务（阶段 1 M3-B）
      description: |
        - 需要正式会话 + CSRF 令牌 + 精确 Origin；预认证会话返回 401。
        - 必须携带 `Idempotency-Key`（16～128 个字母、数字、`-` 或 `_`；客户端为每次发布动作
          生成一个随机 UUID，只在重试同一次发布时复用）。
        - 发布者取自会话；空间与接收者（空间里的另一成员）由服务端推导，请求体不能指定。
          请求体只允许 `CreateTaskRequest` 列出的字段，出现其他字段返回 400。
        - 先以 `(发布者, Idempotency-Key)` 抢占，再分类：同键且请求指纹相同返回 200 与已保存的任务
          （即使其截止时间已过）；同键但内容不同返回 409 IDEMPOTENCY_KEY_REUSED；
          只有新发布才要求截止时间晚于当前时间（否则 400）。
        - 任务与 `task.created` 审计在同一事务内提交（审计不含标题与描述文本），
          提交确认成功后才返回 201。提交结果无法确认时返回 503 RESULT_UNKNOWN，
          客户端应使用同一个 `Idempotency-Key` 重试，不会重复发布。
        - 尚未加入空间返回 404 SPACE_NOT_FOUND；空间只有一名成员返回 409 PARTNER_REQUIRED。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 新任务已发布（提交已确认）
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '200':
          description: 同键同内容的重放，返回已保存的任务
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 分页读取本空间的任务（进行中 / 最近历史）（阶段 1 M3-B）
      description: |
        - 需要正式会话；不要求 CSRF 令牌。空间只取自会话，与游标内容无关。
        - `view=open`：没有完成记录、且没有截止时间或截止时间晚于当前时间的任务，
          按 `(截止时间升序、无截止时间排最后, 创建时间升序, id 升序)` 排序。
        - `view=history`：最近 30 天内完成的任务，以及最近 30 天内到期而未完成的任务，
          按 `(完成或到期时间降序, id 降序)` 排序；窗口按完成或到期时间，不按创建时间。
        - `limit` 必须是 1～100 的整数（默认 50），非法值返回 400。
        - 游标不透明；格式非法、或与 `view` 不匹配时返回 400，且不执行查询。
          两次请求之间任务可能从进行中变为历史，此时从第一页重新加载。
        - 尚未加入空间返回 404 SPACE_NOT_FOUND。
      parameters:
        - $ref: '#/components/parameters/TaskView'
        - $ref: '#/components/parameters/TaskCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页任务
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: 读取本空间的一项任务（阶段 1 M3-B）
      description: |
        - 需要正式会话；不要求 CSRF 令牌。
        - 不存在、或属于其他空间的任务都返回 404 TASK_NOT_FOUND（故意不区分）；
          尚未加入空间返回 404 SPACE_NOT_FOUND。
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/spaces:
    post:
      tags: [space]
      operationId: createSpace
      summary: 创建情侣空间（调用者占 slot=1）
      description: |
        - 事务内：创建 couples 行 + 创建 couple_members(user_id, couple_id, slot=1)。
        - 每个用户最多属于一个 couple（couple_members.user_id 唯一约束兜底）。
      responses:
        '201':
          description: 创建成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/spaces/current:
    get:
      tags: [space]
      operationId: getCurrentSpace
      summary: 查询当前空间与成员
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/spaces/{spaceId}:
    get:
      tags: [space]
      operationId: getSpaceById
      summary: 按 id 查询空间（仅本空间成员）
      description: |
        非本空间成员一律得到 404 `SPACE_NOT_FOUND`（不区分“不存在”与“无权限”），
        避免通过 id 探测其他情侣空间是否存在。
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/spaces/current/invites:
    get:
      tags: [space]
      operationId: listSpaceInvites
      summary: 列出当前空间邀请
      description: 只返回元数据，不返回邀请码明文。
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [space]
      operationId: createSpaceInvite
      summary: 生成情侣邀请（调用者必须是空间成员）
      description: |
        - 邀请码明文只在创建响应中返回一次，数据库只保存 SHA-256。
        - 空间已满（2 名成员）时返回 409 `SPACE_FULL`。
      responses:
        '201':
          description: 创建成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/spaces/current/invites/{inviteId}:
    delete:
      tags: [space]
      operationId: revokeSpaceInvite
      summary: 撤销邀请（仅本空间成员）
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: 已撤销
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invites/{code}/accept:
    post:
      tags: [space]
      operationId: acceptInvite
      summary: 接受邀请并加入情侣空间
      description: |
        必须在单个事务内完成：
        1. 以行锁（`SELECT ... FOR UPDATE`）读取未撤销、未过期、未用尽的邀请；
        2. 校验邀请所属空间未满；
        3. 校验调用者尚未加入任何空间；
        4. 插入 `couple_members`，slot 取该空间当前可用槽位（1 或 2）；
        5. 递增 `used_count` 并写入 `consumed_*`。
        任一步失败整体回滚；唯一约束冲突映射为 409。
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: 加入成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/v1/health:
    get:
      tags: [admin]
      operationId: getAdminHealth
      summary: 管理 API 存活探针（仅回环可达）
      security: []
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/session:
    get:
      tags: [admin]
      operationId: bootstrapAdminSession
      summary: 管理会话引导 / CSRF 获取
      security: []
      responses:
        '200':
          description: 管理会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionBootstrap'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/sessions:
    post:
      tags: [admin]
      operationId: createAdminSession
      summary: 管理员登录（独立于情侣账号体系）
      security: []
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionBootstrap'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [admin]
      operationId: deleteAdminSession
      summary: 管理员注销
      responses:
        '204':
          description: 已注销
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: 用户列表骨架（只读分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/couples:
    get:
      tags: [admin]
      operationId: adminListCouples
      summary: 情侣空间列表骨架（只读分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCoupleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/audit-logs:
    get:
      tags: [admin]
      operationId: adminListAuditLogs
      summary: 审计日志骨架（只读分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditLogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: __Host-usapp-session
      description: 会话 Cookie；状态修改请求同时必须携带 X-CSRF-Token 与匹配 Origin。

  headers:
    NoStore:
      description: 所有 API 响应强制 no-store
      schema:
        type: string
        const: no-store, no-cache, must-revalidate
    SetSessionCookie:
      description: __Host- 前缀要求 Secure + Path=/ + 无 Domain
      schema:
        type: string
        examples:
          - '__Host-usapp-session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Lax'
    ClearSessionCookie:
      schema:
        type: string
        examples:
          - '__Host-usapp-session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0'

  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 12, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskView:
      name: view
      in: query
      required: true
      schema: { type: string, enum: [open, history] }
    TaskCursor:
      name: cursor
      in: query
      description: 上一页响应的 `next_cursor`，原样回传；不透明。
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 每次发布动作一个随机值（建议 UUID）；只在重试同一次发布时复用。
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    Query:
      name: query
      in: query
      schema: { type: string, maxLength: 128 }

  responses:
    BadRequest:
      description: 参数校验失败
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 请求参数不合法
    Unauthenticated:
      description: 未认证或会话已失效 / 验证码错误
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Origin / CSRF / 白名单 / 管理访问来源校验失败
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            csrf:
              value:
                error:
                  code: CSRF_TOKEN_INVALID
                  message: CSRF 令牌校验失败
            origin:
              value:
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: 请求来源不被允许
            whitelist:
              value:
                error:
                  code: REGISTRATION_NOT_ALLOWED
                  message: 该邮箱不在注册白名单内
    NotFound:
      description: 资源不存在（或无权限，故意不区分）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态冲突（空间已存在 / 空间已满 / 已在其他空间 / 邀请已被使用）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务内部错误（细节只写日志）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResultUnknown:
      description: 提交结果无法确认（RESULT_UNKNOWN）；使用同一个 Idempotency-Key 重试
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 触发冷却或频率限制
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Health:
      type: object
      required: [status, version, time]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
        time: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - CSRF_TOKEN_INVALID
                - ORIGIN_NOT_ALLOWED
                - RATE_LIMITED
                - CODE_INVALID_OR_EXPIRED
                - REGISTRATION_NOT_ALLOWED
                - SPACE_NOT_FOUND
                - SPACE_ALREADY_EXISTS
                - SPACE_FULL
                - INVITE_INVALID_OR_EXPIRED
                - INVITE_REVOKED
                - ALREADY_IN_SPACE
                - NOT_FOUND
                - INTERNAL_ERROR
                - TASK_NOT_FOUND
                - PARTNER_REQUIRED
                - IDEMPOTENCY_KEY_REUSED
                - RESULT_UNKNOWN
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        created_at: { type: string, format: date-time }

    SpaceMember:
      type: object
      required: [user_id, slot, display_name, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        slot: { type: integer, enum: [1, 2] }
        display_name: { type: string }
        joined_at: { type: string, format: date-time }

    Space:
      type: object
      required: [id, name, timezone, member_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone:
          type: string
          description: 阶段 0 固定为 Asia/Shanghai，但字段保留以便后续调整
          const: Asia/Shanghai
        member_count: { type: integer, minimum: 0, maximum: 2 }
        created_at: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/SpaceMember' }

    Invite:
      type: object
      required: [id, expires_at, created_at, max_uses, used_count]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        max_uses: { type: integer }
        used_count: { type: integer }
        revoked: { type: boolean }

    CreatedInvite:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [code, invite_url]
          properties:
            code:
              type: string
              description: 明文邀请码，仅在创建响应中出现一次
            invite_url:
              type: string
              format: uri
              description: 形如 {PUBLIC_ORIGIN}/invite/{code}

    SessionBootstrap:
      type: object
      required: [authenticated, csrf_token]
      properties:
        authenticated: { type: boolean }
        csrf_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
        space:
          oneOf:
            - $ref: '#/components/schemas/Space'
            - type: 'null'
        pre_auth_expires_at: { type: string, format: date-time }

    EmailCodeAccepted:
      type: object
      required: [resend_after_seconds, expires_in_seconds]
      properties:
        resend_after_seconds: { type: integer }
        expires_in_seconds: { type: integer }

    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        space:
          oneOf:
            - $ref: '#/components/schemas/Space'
            - type: 'null'

    UpdateMeRequest:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: |
            去掉首尾空白后 1～20 个 Unicode 码点（按码点计数，不按字节或 UTF-16 码元）；
            不得包含控制字符或换行。服务端保存去掉首尾空白后的值。

    Wallet:
      type: object
      additionalProperties: false
      required: [flower, sunshine]
      properties:
        flower:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
        sunshine:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000

    WalletResponse:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        wallet: { $ref: '#/components/schemas/Wallet' }

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, reward_flowers, reward_sunshine]
      properties:
        title:
          type: string
          description: |
            严格 UTF-8；去掉首尾空白（Unicode Zs）后 1～40 个 Unicode 码点；
            任何位置都不得包含控制字符或换行。服务端保存规范化后的值。
        description:
          type: string
          description: |
            可选；CRLF 先归一为 LF，之后只允许 LF 一种换行，其他控制字符（含单独的 CR）拒绝；
            去掉首尾空白与换行后最多 500 个 Unicode 码点。
        reward_flowers: { type: integer, minimum: 0, maximum: 999 }
        reward_sunshine:
          type: integer
          minimum: 0
          maximum: 100000
          description: 两项奖励至少一项大于 0；只接受 JSON 整数（不接受 1.0、字符串或布尔值）。
        deadline:
          oneOf:
            - $ref: '#/components/schemas/TaskDeadlineInput'
            - type: 'null'

    TaskDeadlineInput:
      type: object
      additionalProperties: false
      required: [local_date]
      description: Asia/Shanghai 本地日期与可选时间；只有日期时截止于次日 0 点（不含）。
      properties:
        local_date: { type: string, format: date, description: 'YYYY-MM-DD' }
        local_time:
          oneOf:
            - { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM' }
            - type: 'null'

    TaskDeadline:
      type: object
      additionalProperties: false
      required: [local_date, local_time, at]
      properties:
        local_date: { type: string, format: date }
        local_time:
          oneOf:
            - { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            - type: 'null'
        at:
          type: string
          format: date-time
          description: 截止时刻（不含），UTC，六位小数秒。

    Task:
      type: object
      additionalProperties: false
      required: [id, title, description, creator_id, assignee_id, reward_flowers, reward_sunshine,
                 deadline, status, completed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        creator_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid }
        reward_flowers: { type: integer, minimum: 0, maximum: 999 }
        reward_sunshine: { type: integer, minimum: 0, maximum: 100000 }
        deadline:
          oneOf:
            - $ref: '#/components/schemas/TaskDeadline'
            - type: 'null'
        status:
          type: string
          enum: [open, completed, expired]
          description: 由服务端按读取时刻推导；本版本没有完成接口。
        completed_at:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        created_at: { type: string, format: date-time }

    TaskResponse:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/Task' }

    TaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks, next_cursor]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor:
          oneOf:
            - { type: string }
            - type: 'null'

    SpaceResponse:
      type: object
      required: [space]
      properties:
        space: { $ref: '#/components/schemas/Space' }

    InviteResponse:
      type: object
      required: [invite]
      properties:
        invite: { $ref: '#/components/schemas/CreatedInvite' }

    InviteListResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: '#/components/schemas/Invite' }

    AdminSessionBootstrap:
      type: object
      required: [authenticated, csrf_token]
      properties:
        authenticated: { type: boolean }
        csrf_token: { type: string }
        admin:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }

    AdminUserList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              email: { type: string }
              display_name: { type: string }
              status: { type: string }
              created_at: { type: string, format: date-time }
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]

    AdminCoupleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              member_count: { type: integer }
              created_at: { type: string, format: date-time }
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]

    AdminAuditLogList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              actor_type: { type: string, enum: [user, admin, system] }
              action: { type: string }
              created_at: { type: string, format: date-time }
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]

security:
  - CookieSession: []
