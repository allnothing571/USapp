      required: [space, task, completion, progress, reaction, changes, closure, replaces, read_at]
      properties:
        space: { $ref: '#/components/schemas/AdminTaskSpace' }
        task:
          description: The AdminTaskSummary fields plus description, timezone, deadline_local_date and deadline_local_time.
          type: object
          additionalProperties: false
          required: [id, kind, schedule_type, template_id, period_date, title, creator_id, assignee_id, reward_flowers,
                     reward_sunshine, completion_mode, target_count, progress_count, status, start_date, deadline_at,
                     created_at, completed_at, description, timezone, deadline_local_date, deadline_local_time]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [task, template, period] }
            schedule_type: { type: string, enum: [one_off, custom, daily, weekly] }
            template_id: { type: [string, 'null'], format: uuid }
            period_date: { type: [string, 'null'], format: date }
            title: { type: string }
            creator_id: { type: string, format: uuid }
            assignee_id: { type: string, format: uuid }
            reward_flowers: { $ref: '#/components/schemas/AdminDecimal' }
            reward_sunshine: { $ref: '#/components/schemas/AdminDecimal' }
            completion_mode: { type: string, enum: [single, count] }
            target_count: { type: integer, minimum: 1 }
            progress_count: { type: integer, minimum: 0 }
            status: { type: string, enum: [completed, cancelled, superseded, expired, upcoming, open] }
            start_date: { type: [string, 'null'], format: date }
            deadline_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            completed_at: { type: [string, 'null'], format: date-time }
            description: { type: string }
            timezone: { type: string }
            deadline_local_date: { type: [string, 'null'], format: date }
            deadline_local_time: { type: [string, 'null'], pattern: '^[0-9]{2}:[0-9]{2}$' }
        completion:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [completed_by, completed_at, reward_flowers, reward_sunshine]
              properties:
                completed_by: { type: string, format: uuid }
                completed_at: { type: string, format: date-time }
                reward_flowers: { $ref: '#/components/schemas/AdminDecimal' }
                reward_sunshine: { $ref: '#/components/schemas/AdminDecimal' }
        progress:
          type: object
          additionalProperties: false
          required: [total, items]
          properties:
            total: { type: integer, minimum: 0 }
            items:
              type: array
              maxItems: 200
              description: Newest first by progress_count; at most 200 even when total is larger.
              items:
                type: object
                additionalProperties: false
                required: [id, user_id, progress_count, target_count, recorded_at, completes_task]
                properties:
                  id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  progress_count: { type: integer, minimum: 1 }
                  target_count: { type: integer, minimum: 1 }
                  recorded_at: { type: string, format: date-time }
                  completes_task: { type: boolean }
        reaction:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, author_id, kind, emoji_code, body, created_at]
              properties:
                id: { type: string, format: uuid }
                author_id: { type: string, format: uuid }
                kind: { type: string, enum: [emoji, text] }
                emoji_code: { type: [string, 'null'] }
                body: { type: [string, 'null'] }
                created_at: { type: string, format: date-time }
        changes:
          type: object
          additionalProperties: false
          required: [owner_task_id, total, items]
          properties:
            owner_task_id: { type: string, format: uuid, description: The root row the proposals belong to (the template for a period). }
            total: { type: integer, minimum: 0 }
            items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AdminTaskProposal' } }
        closure:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [owner_task_id, reason, closed_at, proposal_id, successor_task_id, applies_to_this_task]
              properties:
                owner_task_id: { type: string, format: uuid }
                reason: { type: string, enum: [cancelled, superseded] }
                closed_at: { type: string, format: date-time }
                proposal_id: { type: string, format: uuid }
                successor_task_id: { type: [string, 'null'], format: uuid }
                applies_to_this_task:
                  type: boolean
                  description: False for a period that ended before its template was closed (it keeps its own state).
        replaces:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [task_id, proposal_id, decided_at]
              properties:
                task_id: { type: string, format: uuid }
                proposal_id: { type: string, format: uuid }
                decided_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }

    AdminAvatarItem:
      type: object
      description: The AvatarItem fields plus listed, family, created_at and revised_at.
      required: [id, category, starter, version, name, price_sunshine, asset, listed, family, created_at, revised_at, owner_count]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [hair, clothes, expression, hat, handheld, accessory] }
        starter: { type: boolean }
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 20 }
        price_sunshine: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        asset: { $ref: '#/components/schemas/AvatarAsset' }
        listed: { type: boolean }
        family: { type: string }
        created_at: { type: string, format: date-time }
        revised_at: { type: string, format: date-time }
        owner_count: { type: [integer, 'null'], minimum: 0, description: 'B2 additive: paid owners; null for a starter. No individual inventories.' }
    AdminAvatarItemList:
      type: object
