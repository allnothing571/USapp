  /api/admin/v1/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: 用户列表骨架（只读分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/users/{userId}/notifications:
    get:
      tags: [admin]
      operationId: adminListUserNotifications
      summary: Read-only notification and recorded push metadata for one user
      description: |
        AdminFilter requires peer CIDR, admin surface header and independent admin authentication.
        Exact recipient scope. Each page is one SQL snapshot, newest (created_at,id); cursor bound to user.
        Per notification, newest five delivery generations and only their latest attempt are shown; total is a decimal string.
        Observations and final outcomes are stored facts, not an inferred current retry/eligibility state. Accepted means
        a provider accepted the request, not that a device displayed it. No delivery record does not prove why no push occurred.
        Expiry records and missing observations do not prove that an earlier request was never sent.
        No content, target ids, endpoints, keys, payloads, worker instance ids, intents or preferences are returned.
        Reads never mark notifications read, claim, retry, send, revoke or modify delivery state. User may have no space.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 160, pattern: '^n1\.[1-9][0-9]{0,18}\.[0-9a-f-]{36}\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Read-only metadata page (empty for an existing user without notifications)
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNotificationPage' }
        '400': { description: VALIDATION_ERROR (id, limit or cursor, including a cursor of another user) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND (unknown user) }

  /api/admin/v1/users/{userId}/sessions:
    get:
      tags: [admin]
      operationId: adminListUserSessions
      summary: Session metadata for one selected user (admin, read-only)
      description: |
        AdminFilter requires peer CIDR, admin surface header and independent admin authentication.
        Only sessions of the selected user are listed (pre-authentication sessions have no user and are excluded).
        Timestamp/revocation metadata only; never tokens, token hashes, CSRF hashes, raw user agents, IPs or rotation links.
        State precedence: revoked, then expired (expires_at <= read_at), otherwise valid. Valid means time-valid and
        unrevoked, not that authentication is permitted: the user's account can be disabled or other checks may refuse.
        One statement snapshot includes user existence/status, one page and read_at. Each page is a separate snapshot.
        Newest first by (created_at,id), cursor bound to the selected user. No writes, touch, rotation, revocation or renewal.
        Existing user without a space or sessions: 200 with an empty page; unknown user: 404 NOT_FOUND.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 160, pattern: '^s1\.[1-9][0-9]{0,18}\.[0-9a-f-]{36}\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Session metadata page
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserSessionPage' }
        '400': { description: VALIDATION_ERROR (id, limit, malformed or other-user cursor) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND (unknown user) }

  /api/admin/v1/users/{userId}/wallet:
    get:
      tags: [admin]
      operationId: adminGetUserWallet
      summary: One selected user's flower and sunshine balances (admin, read-only, 0.47.0)
      description: |
        AdminFilter: peer CIDR, the admin surface header and an admin session; an ordinary user session never authorizes it.
        Existence, membership and both balances come from one statement (one snapshot). A balance is the newest ledger
        entry's balance_after by the per-user/per-asset seq, or "0" without entries; account_exists says whether a wallet
        account row exists. All amounts and sequences are canonical decimal strings (signed 64-bit). Writes nothing.
        GET /api/v1/wallet stays caller-only. See docs/admin-wallet-ledger.md.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Balances
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWalletSummary' }
        '400': { description: VALIDATION_ERROR (malformed user id) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND (no such user) }
  /api/admin/v1/users/{userId}/wallet/ledger:
    get:
      tags: [admin]
      operationId: adminListUserLedger
      summary: One selected user's ledger entries for one asset, newest first by seq (admin, read-only, 0.47.0)
      description: |
        Keyset pagination by the per-user/per-asset seq (descending). A cursor is valid only for the same user and asset;
        anything else answers 400. Each page is one statement: the page, account flag, balance and latest_seq share one
        snapshot; separate pages and the summary are separate reads. Only allowlisted fields: no keys, fingerprints, lock
        tokens, actors or other users' entries.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: query, required: true, schema: { type: string, enum: [flower, sunshine] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 128, pattern: '^w1\.(flower|sunshine)\.[1-9][0-9]{0,18}\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: One page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLedgerPage' }
        '400': { description: VALIDATION_ERROR (malformed id, asset, limit or cursor; cursor of another user or asset) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND (no such user) }

  /api/admin/v1/couples/{coupleId}/redemptions:
    get:
      tags: [admin]
      operationId: adminListCoupleRedemptions
      summary: Read-only local-admin redemption list
      description: |
        Requires AdminFilter (peer CIDR, admin surface header, independent admin session). No writes.
        Uses reward_redemption_state, the same state view as the public redemption API. Immutable product snapshot,
        never today's catalog terms. Price is a decimal string. No keys, fingerprints or wallet operation identifiers.
        Each answer is one SQL statement; pages and detail have separate snapshots. Status changes between pages can
        change membership in a filtered list; refresh to restart. Newest first by (created_at, id).
        Cursor bound to the couple and status filter, not a frozen cross-page snapshot; no time window.
      parameters:
        - { name: coupleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending_confirmation, pending_fulfillment, fulfilled, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        '200':
          description: Read-only snapshot
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRedemptionPage' }
        '400': { description: VALIDATION_ERROR (malformed id, status, limit or cursor; wrong cursor scope) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SPACE_NOT_FOUND or REDEMPTION_NOT_FOUND (foreign and unknown redemptions are indistinguishable) }
  /api/admin/v1/couples/{coupleId}/redemptions/{redemptionId}:
    get:
      tags: [admin]
      operationId: adminGetCoupleRedemption
      summary: Read-only local-admin redemption detail
      description: |
        Requires AdminFilter (peer CIDR, admin surface header, independent admin session). No writes.
        Uses reward_redemption_state, the same state view as the public redemption API. Immutable product snapshot,
        never today's catalog terms. Price is a decimal string. No keys, fingerprints or wallet operation identifiers.
        Each answer is one SQL statement; pages and detail have separate snapshots. Status changes between pages can
        change membership in a filtered list; refresh to restart. Newest first by (created_at, id).
        Events: newest 100 by (created_at, id), with total count; fulfillment is reported separately in the snapshot.
      parameters:
        - { name: coupleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: redemptionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Read-only snapshot
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRedemptionDetail' }
        '400': { description: VALIDATION_ERROR (malformed id, status, limit or cursor; wrong cursor scope) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SPACE_NOT_FOUND or REDEMPTION_NOT_FOUND (foreign and unknown redemptions are indistinguishable) }

