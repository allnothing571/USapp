      description: |
        Per user: the partner's Home is unaffected and the partner's pin is never returned. The
        target must belong to the caller's space (ANNIVERSARY_NOT_FOUND otherwise). A same-key
        replay returns the original pin mutation and never appends or restores a pin.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
