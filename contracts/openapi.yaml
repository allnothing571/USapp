  /api/v1/messages/{messageId}/reply:
    post:
      tags: [messages]
      operationId: replyMessage
      summary: The recipient's single one-line reply
      description: |
        Only the message's recipient replies (the author gets MESSAGE_REPLY_FORBIDDEN); at most one
        reply per message (MESSAGE_ALREADY_REPLIED). Body: 1-100 code points, one line. Concurrent
        replies: exactly one wins. Same author/key and body replay; a different body returns
        IDEMPOTENCY_KEY_REUSED. Unconfirmed commit returns RESULT_UNKNOWN. Requires Origin and CSRF.
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
