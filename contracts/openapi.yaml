        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, pattern: '^[A-Za-z0-9_-]{87}$', description: base64url 65-byte uncompressed P-256 point }
            auth: { type: string, pattern: '^[A-Za-z0-9_-]{22}$', description: base64url 16 bytes }

