      properties:
        expected_version: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        price_flowers: { type: integer, minimum: 1, maximum: 999 }
        redemption_mode: { type: string, enum: [direct, request] }

    ArchiveRewardProductRequest:
