openapi: 3.1.0

info:
  title: USapp API（阶段 0 冻结契约 + 阶段 1 增量）
  version: 0.67.0
  description: |
    阶段 0 只覆盖：登录与会话、注册白名单、情侣空间创建与邀请加入、
    当前用户/空间查询、健康检查、管理后台骨架。

    0.2.0 起为阶段 1 的增量版本：阶段 0 的全部操作、字段与行为保持冻结不变；
    阶段 1 只新增操作。当前新增：`PATCH /api/v1/me`（修改自己的昵称，M1），
    `GET /api/v1/wallet`（只读自己的资产余额，M2-B，0.3.0 起），
    `POST /api/v1/tasks`、`GET /api/v1/tasks`、`GET /api/v1/tasks/{taskId}`
    （一次性任务的发布与读取，M3-B，0.4.0 起），
    `POST /api/v1/tasks/{taskId}/completion`（接收者完成单次任务并入账奖励，M3-C1，0.5.0 起），
    `POST /api/v1/tasks/{taskId}/progress`（计数任务 +1，达到目标时结算，M4，0.6.0 起），
    `POST /api/v1/tasks/{taskId}/changes` 与 `POST /api/v1/tasks/{taskId}/changes/{proposalId}/decision`
    （任务修改/取消的提议与对方确认，M6，0.10.0 起；Task 新增可选字段 closure、replaces、pending_change），
    `/api/v1/rewards/products` 系列（奖励商店商品的上架、列表、详情、修改与下架，M7，0.11.0 起），
    `/api/v1/rewards/products/{productId}/redemptions` 与 `/api/v1/rewards/redemptions` 系列
    （直接兑换、兑换记录与履约从 M8/0.12.0 起；申请确认与协商取消退款从 M9/0.13.0 起），
    `/api/v1/messages` 系列（双人留言板：留言、历史、详情与单条回复，阶段 2 P2-1，0.14.0 起），
    `/api/v1/anniversaries` 系列（纪念日与倒数日：创建、列表、详情、创建者修改、对方修改申请与处理、
    首页展示与个人置顶，阶段 2 P2-2，0.15.0 起）。

    契约级硬约束（所有实现必须遵守，后续阶段不得放宽）：
    - Web 与 API 同源部署，全部接口只允许来自配置的 PUBLIC_ORIGIN。
    - 正式会话 Cookie 名固定为 `__Host-usapp-session`，属性固定为
      `Secure; HttpOnly; SameSite=Lax; Path=/`，且**不设置 Domain**。
    - 登录前使用短期预认证会话；发送验证码与建立会话同样需要
      预认证会话 + CSRF 令牌 + 精确匹配的 Origin。
    - 所有状态修改请求（POST/PUT/PATCH/DELETE）必须携带
      `X-CSRF-Token`，且请求 `Origin` 必须与 PUBLIC_ORIGIN 完全相等（字符串比较）。
    - 登录成功后必须更换会话标识与 CSRF 令牌。
    - 所有 `/api/**` 响应必须带 `Cache-Control: no-store`，禁止被 Service Worker 缓存。
    - 注册白名单只控制“新账号注册”，不定义任何业务权限。
    - 移除会话（注销）后服务端立即失效会话。

servers:
  - url: https://localhost:8443
    description: 本地同源开发入口（Caddy，自签证书，需负责人手动信任）
  - url: https://usapp.example.invalid
    description: 生产同源入口占位（域名由负责人补充）

tags:
  - name: avatar
    description: Avatar catalog and appearance (Phase 4 B1)
  - name: session
    description: 会话引导、建立与注销
  - name: auth
    description: 邮箱验证码登录
  - name: space
    description: 情侣空间与邀请
  - name: wallet
    description: 当前用户自己的资产（只读）
  - name: tasks
    description: 一次性任务的发布、读取（M3-B）与完成结算（M3-C1）
  - name: rewards
    description: 奖励商店商品（M7；不含兑换与扣款）
  - name: messages
    description: 双人留言板（阶段 2 P2-1；纯文本留言与单条回复，不是聊天）
  - name: anniversaries
    description: 纪念日与倒数日（阶段 2 P2-2；北京时间日期，无提醒、无图片、无删除）
  - name: memories
    description: 照片回忆（阶段 3 P3-1b；时间线、创建者修改、对方修改申请与处理，0.25.0 起；无删除，无通知）
  - name: albums
    description: 共享相册（阶段 3 P3-2a；创建、加入上传的照片、上传者移除、封面，0.26.0 起；P3-2b 创建者改名、对方改名申请与处理，0.27.0 起；无删除，无通知）
  - name: admin
    description: 管理后台（仅回环 / 受信代理可达）

paths:
  /api/v1/health:
    get:
      tags: [session]
      operationId: getHealth
      summary: 存活探针（无需会话）
      security: []
      responses:
        '200':
          description: 服务存活
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/v1/session:
    get:
      tags: [session]
      operationId: bootstrapSession
      summary: 会话引导（同时是 CSRF 令牌获取入口）
      description: |
        - 若请求携带有效正式会话：返回 `authenticated=true` 与当前用户/空间。
        - 否则建立/复用短期预认证会话（TTL 30 分钟），返回 `authenticated=false`。
        - 任何情况下都返回当前会话绑定的 `csrf_token`。
        - 该接口本身不修改服务端业务状态，因此不要求 CSRF 令牌；但响应 `no-store`。
      security: []
      responses:
        '200':
          description: 当前会话状态
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'

  /api/v1/auth/email-codes:
    post:
      tags: [auth]
      operationId: requestEmailCode
      summary: 发送一次性邮箱验证码
      description: |
        - 需要预认证或正式会话 + CSRF 令牌 + 精确 Origin。
        - 无论目标邮箱是否在白名单、是否已注册，一律返回 202，避免账号枚举。
        - 白名单只决定“该邮箱能否创建新账号”，在验证码校验阶段才产生 403。
        - 同一会话 / 同一邮箱存在发送冷却（`resend_after_seconds`）。
      responses:
        '202':
          description: 已受理（不保证邮件已投递）
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCodeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: 校验验证码并建立正式会话
      description: |
        - 需要预认证会话 + CSRF 令牌 + 精确 Origin。
        - 验证码消费、用户创建/复用、会话轮换必须在同一事务内完成。
        - 成功时更换会话标识与 CSRF 令牌（旧预认证会话被撤销）。
        - 若邮箱未注册且不在白名单：403 `REGISTRATION_NOT_ALLOWED`。
      responses:
        '200':
          description: 登录成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: 注销当前会话
      description: 需要正式或预认证会话 + CSRF 令牌 + 精确 Origin；服务端立即撤销并清空 Cookie。
      responses:
        '204':
          description: 已注销
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'

  /api/v1/me:
    get:
      tags: [session]
      operationId: getMe
      summary: 当前用户与所属空间
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [session]
      operationId: updateMe
      summary: 修改当前用户自己的昵称（阶段 1 M1）
      description: |
        - 需要正式会话 + CSRF 令牌 + 精确 Origin；预认证会话返回 401。
        - 被修改的用户只取自服务端会话；请求体不能指定目标用户。
          请求体只允许一个字段 `display_name`，出现任何其他字段返回 400。
        - 去掉首尾空白后要求 1～20 个 Unicode 码点；非法 UTF-8、控制字符与换行
          （任何位置）返回 400。昵称允许重复。
        - 昵称更新与审计事件在同一事务内提交，提交确认成功后才返回 200。
        - 成功返回与 `GET /api/v1/me` 相同的 `MeResponse`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 已更新
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/me/export:
    post:
      tags: [session]
      operationId: createUserDataExport
      summary: Download the caller's structured data export (E1, 0.46.0)
      description: |
        Formal session, exact Origin and CSRF token, as every user write. The body is absent or exactly {}: any member
        (for example user_id or scope), a non-object or invalid JSON answers 400. No Idempotency-Key: the operation is
        read only and writes no audit, notification, wallet, achievement or journal row; a retry is a new export.
        Scope (owner Q1=B): the caller's own account data plus the currently authorized shared-space records; never the
        partner's wallet, purchases, loadouts, achievements, reminder rules, notifications or email. Currently deleted
        memories and photos (undoable included) and their history are absent; a reference to an invisible photo or a
        deleted memory is a withheld marker without an id; while deletion recovery is closed the memory and album
        sections are unavailable. No photo bytes, object keys or signed URLs.
        One READ ONLY READ COMMITTED transaction: a shared recovery lock in its own statement, then one generation
        statement (one snapshot). Bounds (process-local admission, end-to-end deadline, lock and statement timeouts,
        per-section and total row caps, pre-aggregation byte cap, exact final size cap) fail closed: no partial document.
        Cache-Control no-store keeps HTTP caches from storing the response; it does not revoke a downloaded file.
        Field allowlist and limits: docs/user-data-export-design.md Sections 4-7.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200':
          description: The complete document, as an attachment named usapp-export-<UTC YYYYMMDDTHHMMSSZ>.json
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              schema: { type: string, pattern: '^attachment; filename="usapp-export-[0-9]{8}T[0-9]{6}Z\.json"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDataExport' }
        '400': { description: VALIDATION_ERROR (any request member or a malformed body) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: ORIGIN_NOT_ALLOWED or CSRF_TOKEN_INVALID }
        '404': { description: SPACE_NOT_FOUND }
        '413': { description: EXPORT_TOO_LARGE (a row, pre-aggregation byte or final size cap; no document) }
        '429':
          description: RATE_LIMITED (process-local admission or the per-user interval)
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
        '503': { description: EXPORT_UNAVAILABLE (deadline, lock or statement timeout, or database failure; no document) }
  /api/v1/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      summary: 查询当前用户自己的资产余额（阶段 1 M2-B）
      description: |
        - 需要正式会话；匿名或预认证会话返回 401。不要求 CSRF 令牌。
        - 用户仅取自服务端会话，不接受目标用户参数；尚未加入空间返回 404 SPACE_NOT_FOUND。
        - 同一查询快照读取两种资产的最新流水余额；没有流水时返回 0。
        - 不创建账户、不写入流水或审计，禁止缓存。
      responses:
        '200':
          description: 自己的当前余额
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: 资产查询暂时失败
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: 给同一空间的另一成员发布一次性任务（阶段 1 M3-B）
      description: |
        - 需要正式会话 + CSRF 令牌 + 精确 Origin；预认证会话返回 401。
        - 必须携带 `Idempotency-Key`（16～128 个字母、数字、`-` 或 `_`；客户端为每次发布动作
          生成一个随机 UUID，只在重试同一次发布时复用）。
        - 发布者取自会话；空间与接收者（空间里的另一成员）由服务端推导，请求体不能指定。
          请求体只允许 `CreateTaskRequest` 列出的字段，出现其他字段返回 400。
        - 先以 `(发布者, Idempotency-Key)` 抢占，再分类：同键且请求指纹相同返回 200 与已保存的任务
          （即使其截止时间已过）；同键但内容不同返回 409 IDEMPOTENCY_KEY_REUSED；
          只有新发布才要求截止时间晚于当前时间（否则 400）。
        - 任务与 `task.created` 审计在同一事务内提交（审计不含标题与描述文本），
          提交确认成功后才返回 201。提交结果无法确认时返回 503 RESULT_UNKNOWN，
          客户端应使用同一个 `Idempotency-Key` 重试，不会重复发布。
        - 尚未加入空间返回 404 SPACE_NOT_FOUND；空间只有一名成员返回 409 PARTNER_REQUIRED。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 新任务已发布（提交已确认）
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPublishResponse'
        '200':
          description: 同键同内容的重放，返回已保存的任务
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPublishResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 分页读取本空间的任务（进行中 / 最近历史）（阶段 1 M3-B）
      description: |
        - 需要正式会话；不要求 CSRF 令牌。空间只取自会话，与游标内容无关。
        - `view=open`：没有完成记录、且没有截止时间或截止时间晚于当前时间的任务，
          按 `(截止时间升序、无截止时间排最后, 创建时间升序, id 升序)` 排序。
        - `view=history`：最近 30 天内完成的任务，以及最近 30 天内到期而未完成的任务，
          按 `(完成或到期时间降序, 存储行 id 降序)` 排序；窗口按完成或到期时间，不按创建时间。
          每日历史的唯一排序键使用周期实例 id；公开任务 id 仍是模板 id，游标应原样回传。
        - `limit` 必须是 1～100 的整数（默认 50），非法值返回 400。
        - 游标不透明；格式非法、或与 `view` 不匹配时返回 400，且不执行查询。
          两次请求之间任务可能从进行中变为历史，此时从第一页重新加载。
        - 尚未加入空间返回 404 SPACE_NOT_FOUND。
      parameters:
        - $ref: '#/components/parameters/TaskView'
        - $ref: '#/components/parameters/TaskCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页任务
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: 读取本空间的一项任务（阶段 1 M3-B）
      description: |
        - 需要正式会话；不要求 CSRF 令牌。
        - 不存在、或属于其他空间的任务都返回 404 TASK_NOT_FOUND（故意不区分）；
          尚未加入空间返回 404 SPACE_NOT_FOUND。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: period_date
          in: query
          required: false
          description: 每日任务的历史日期，或每周任务该周的周一；省略时返回当前周期，未触及的过去周期无记录。
          schema: { type: string, format: date }
      responses:
        '200':
          description: 任务详情
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{taskId}/reaction:
    post:
      tags: [tasks]
      operationId: reactToTask
      summary: Creator responds once to an actual completed task period
      description: >-
        No reward or progress writes. Daily/weekly require an explicit period_date (Monday for weekly).
        An old completed period remains reactable. Creator only; incomplete returns TASK_NOT_COMPLETED;
        duplicate different key returns TASK_ALREADY_REACTED; self reaction returns TASK_REACTION_FORBIDDEN.
        Same-key replay returns immutable facts. No task-reaction notifications.
      security: [{ CookieSession: [] }]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [kind, emoji_code]
                  properties:
                    kind: { const: emoji }
                    emoji_code: { type: string, enum: [heart, clap, flower] }
                    period_date: { type: string, format: date }
                - type: object
                  additionalProperties: false
                  required: [kind, body]
                  properties:
                    kind: { const: text }
                    body: { type: string, minLength: 1, maxLength: 40, description: Trimmed single line; code points }
                    period_date: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskReactionResponse' }
        '200':
          description: Same-key replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskReactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/tasks/{taskId}/completion:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: 接收者完成一次性任务并入账奖励（阶段 1 M3-C1）
      description: |
        - 需要正式会话 + CSRF 令牌 + 精确 Origin；预认证会话返回 401。
        - 必须携带 `Idempotency-Key`（规则同发布）；请求体必须为空，或恰好是空对象 `{}`。
        - 只有任务的接收者可以完成（发布者返回 403 TASK_NOT_ASSIGNEE）；不存在或属于其他空间的任务
          返回 404 TASK_NOT_FOUND；尚未加入空间返回 404 SPACE_NOT_FOUND。
        - 同一事务内：抢占钱包操作、为每种正奖励资产写一条流水、写完成记录与 `task.completed` 审计；
          提交确认成功后才返回 200。奖励由系统新建给接收者，不扣发布者。
        - 同键同任务的重试返回 200 与与首次完全相同的响应体（重放不重新判断截止时间）；
          同键用于其他操作返回 409 IDEMPOTENCY_KEY_REUSED；任务已被其他请求完成返回
          409 TASK_ALREADY_COMPLETED（优先于过期判断）；决策时刻不早于截止时间返回 409 TASK_EXPIRED；
          入账会超过余额上限返回 409 WALLET_BALANCE_LIMIT（整体拒绝，不截断）。
        - 响应只含不可变的任务与结算事实，不含当前余额；客户端随后读取 `GET /api/v1/wallet`。
        - 仅 single 任务使用本操作；count 任务返回 409 TASK_COMPLETION_MODE_INVALID，须使用 /progress。
        - 提交结果无法确认时返回 503 RESULT_UNKNOWN；使用同一个 `Idempotency-Key` 重试，不会重复入账。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: 已完成（首次完成或同键重放，响应体相同）
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'

  /api/v1/tasks/{taskId}/progress:
    post:
      tags: [tasks]
      operationId: progressTask
      summary: 接收者为计数任务记录一次 +1
      description: |
        - 正式会话、精确 Origin、会话绑定的 CSRF；必须带 Idempotency-Key。
          一次性任务请求体为空或 {}；每天重复的任务必须传 {period_date: YYYY-MM-DD}，使用页面显示的北京时间日期；
          每周重复（0.8.0 起）传页面显示的该周周一，非周一返回 400 VALIDATION_ERROR。
          指定日期范围（custom，0.9.0 起）与一次性任务相同，请求体为空或 {}。
        - 只支持 count 任务，single 返回 409 TASK_COMPLETION_MODE_INVALID；只有接收者可操作。
        - 每个已确认动作增加一次，目标次数使用正整数（PostgreSQL integer 存储边界）。
          未达到目标不创建钱包操作；最后一次进度、完成记录、流水及审计在同一事务提交。
        - 进度键作用域为 (接收者, 进度动作, key)，与单次完成的键分开。
          同键同任务同周期返回原事件快照；同键另一任务或另一周期返回 409 IDEMPOTENCY_KEY_REUSED。
        - 每天重复按 Asia/Shanghai 的 [当天 0 点, 次日 0 点) 独立计数；每周重复按 [周一 0 点, 下周一 0 点) 独立计数。
          次数不结转，每个周期至多结算一次；只支持 count。已提交的旧周期请求按原周期重放；
          旧周期的新请求在该周期已达目标时返回 ignored，否则返回 409 TASK_EXPIRED，从不计入新周期。
          新请求不能在旧周期增加次数。旧周期已提交的键仍可重放；已达目标的旧周期返回 ignored。
        - 指定日期范围在开始日期北京时间 0 点之前返回 409 TASK_NOT_STARTED（不写入任何业务数据）；
          范围内各天累计计数，达到目标只结算一次；结束日期次日 0 点后按原有截止规则处理。
        - 重放先于截止时间检查。新动作的决策时间必须严格早于截止时间；最后一次的决策在账户锁与上限检查后。
        - 已达目标时新键请求返回 ignored=true，不新增进度、审计或奖励，也不占用新键。
        - 响应的 progress_count 是该动作时的不可变快照；客户端重新读取列表，不能用旧重放覆盖最新进度。
          settlement 仅在该事件达到目标（或目标已经达到）时返回，不含余额。
        - 提交结果不明为 503 RESULT_UNKNOWN；保留同一键显式重试，不自动提交。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressTaskRequest'
      responses:
        '200':
          description: 已记录、同键重放或已经达到目标（ignored）
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'

  /api/v1/tasks/{taskId}/changes:
    post:
      tags: [tasks]
      operationId: proposeTaskChange
      summary: 提出修改（发布者）或取消（任一成员）任务，等待对方确认
      description: |
        - 正式会话、精确 Origin、会话绑定的 CSRF；必须带 Idempotency-Key。taskId 是根任务 id
          （daily/weekly 为模板 id）。
        - kind=edit 只能由发布者提出，terms 是完整的新内容（与 CreateTaskRequest 相同，重复方式不可改）；
          kind=cancel 可由任一成员提出。
        - 每个根任务至多一个待确认的变更（409 TASK_CHANGE_PENDING）；不会自动过期。待确认期间原任务照常可完成/+1。
        - 已完成或已过期的一次性/指定范围任务不能再提出（409 TASK_ALREADY_COMPLETED / TASK_EXPIRED）；
          已取消/已替换返回 409 TASK_CANCELLED / TASK_SUPERSEDED。
        - 同键同内容重放返回原提议（200）；同键不同内容 409 IDEMPOTENCY_KEY_REUSED。
          响应的 change 是不可变事实；task 是读取时的当前状态，重放时可能不同。
        - 提交结果不明为 503 RESULT_UNKNOWN；保留同一键显式重试。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeTaskChangeRequest'
      responses:
        '201':
          description: 已提出，等待对方确认
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskChangeResponse'
        '200':
          description: 同键重放
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskChangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'

  /api/v1/tasks/{taskId}/changes/{proposalId}/decision:
    post:
      tags: [tasks]
      operationId: decideTaskChange
      summary: 对方同意或拒绝，提出者撤回
      description: |
        - 正式会话、精确 Origin、会话绑定的 CSRF；必须带 Idempotency-Key。每个提议至多一个决定
          （之后的新请求 409 TASK_CHANGE_DECIDED）。approve/reject 只能由另一方，withdraw 只能由提出者
          （否则 403 TASK_CHANGE_FORBIDDEN）。
        - 同意修改：原任务关闭为 superseded，同一事务创建新任务（successor，内容即提议）；同意取消：原任务关闭为
          cancelled。已有的进度、完成、奖励与审计从不改写或撤销。
        - 同意修改要求受影响的任务（一次性/指定范围任务，或重复任务的当前周期）没有进度也没有完成，
          否则 409 TASK_HAS_PROGRESS，提议仍待确认（可以拒绝或撤回）。取消可以在有进度时同意，进度保留、不发放部分奖励。
          重复任务的取消在当前周期已完成时也可以同意：已完成的周期保留完成与奖励，之后不再产生新周期。
        - 在决定时刻再次检查：一次性/指定范围任务已完成/已过期返回 409；提议的截止时间已过、或改动后的开始日期早于今天
          （保留原开始日期除外）返回 409 TASK_EXPIRED。
        - 同键同内容重放返回原决定的不可变事实（200）；task/successor 为当前状态。
        - 提交结果不明为 503 RESULT_UNKNOWN；保留同一键显式重试。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTaskChangeRequest'
      responses:
        '200':
          description: 已决定，或同键重放
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskChangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'

  /api/v1/rewards/products:
    post:
      tags: [rewards]
      operationId: createRewardProduct
      summary: 为对方上架一件奖励（M7）
      description: |
        - 正式会话、精确 Origin、会话绑定的 CSRF；必须带 Idempotency-Key。拥有者（将来兑换的一方）由服务端取为对方；
          没有对方时 409 PARTNER_REQUIRED。价格为 1-999 的整数小红花。M7 不实现兑换，不写入任何钱包数据。
        - 同键同内容重放返回原上架的不可变事实（200）；同键不同内容 409 IDEMPOTENCY_KEY_REUSED。
        - 提交结果不明为 503 RESULT_UNKNOWN；保留同一键显式重试。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardProductTerms'
      responses:
        '201':
          description: 已上架
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardProductMutationResponse'
        '200':
          description: 同键重放
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardProductMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'
    get:
      tags: [rewards]
      operationId: listRewardProducts
      summary: 调用者可见的奖励（游标分页）
      description: |
        - 上架的一方看到自己上架的全部（含已下架）；对方只看到上架中的。每一页都按此规则过滤。
        - 按不可变的 (created_at, id) 从新到旧排序；next_cursor 为 null 表示没有更多。游标或 limit 无效返回 400，不执行查询。
        - 分页不是快照：两次请求之间的修改或下架可能改变哪些奖励可见（例如对方看到的商品在翻页期间被下架）。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z_[0-9a-f-]{36}$' }
          description: 上一页响应的 next_cursor，原样回传。
      responses:
        '200':
          description: 列表
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

