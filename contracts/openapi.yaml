        expression: { type: string, format: uuid }
        admin_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AdminAvatarStarterResponse:
      type: object
      required: [starter]
      properties:
        starter: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AdminAvatarStarter' }] }
    AdminAvatarStarterRequest:
      type: object
      additionalProperties: false
      required: [expected_version, hair, clothes, expression]
      properties:
        expected_version: { type: integer, minimum: 0 }
        hair: { type: string, format: uuid }
        clothes: { type: string, format: uuid }
        expression: { type: string, format: uuid }
    AdminAvatarStarterMutation:
      type: object
      required: [replayed, starter]
      properties:
        replayed: { type: boolean }
        starter: { $ref: '#/components/schemas/AdminAvatarStarter' }

    OptionalNotificationResult:
      description: |
        P2-3b immutable facts of the ORIGINAL write's notification decision, identical on same-key
        replay; null for a legacy operation without a recorded decision. "created" means a durable
        in-app notice, not Push delivery or that it was seen. no_partner is a successful write.
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          required: [requested, created, reason, notification_id]
          properties:
            requested: { type: boolean }
            created: { type: boolean }
            reason: { type: string, enum: [delivered_to_inbox, not_requested, no_partner] }
            notification_id: { type: [string, 'null'], format: uuid }

    TaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks, next_cursor]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor:
          oneOf:
            - { type: string }
            - type: 'null'

    CompleteTaskRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: 可选；只能是空对象。

    TaskSettlement:
      type: object
      additionalProperties: false
      required: [operation_id, flower, sunshine]
      properties:
        operation_id: { type: string, format: uuid }
        flower: { type: integer, minimum: 0, maximum: 999, description: 本次入账的小红花（未奖励为 0） }
        sunshine: { type: integer, minimum: 0, maximum: 100000, description: 本次入账的阳光值（未奖励为 0） }

    CompleteTaskResponse:
      type: object
      additionalProperties: false
      required: [task, settlement]
      description: 只含不可变事实；不含当前余额。
      properties:
        task: { $ref: '#/components/schemas/Task' }
        settlement: { $ref: '#/components/schemas/TaskSettlement' }

    ProgressTaskRequest:
      type: object
      additionalProperties: false
      description: '一次性任务为空或 {}；daily/weekly 必须有 period_date（weekly 为该周周一），旧周期的迟到请求不能计入当前周期。'
      properties:
        period_date: { type: string, format: date }

    ProgressTaskResponse:
      type: object
      additionalProperties: false
      required: [task_id, event_id, progress_count, target_count, recorded_at, completed, ignored, settlement]
      properties:
        period_date: { type: string, format: date, description: 每日/每周动作原周期的不可变标识（weekly 为周一）；一次性任务省略。 }
        task_id: { type: string, format: uuid }
        event_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        progress_count: { type: integer, minimum: 1, maximum: 2147483647 }
        target_count: { type: integer, minimum: 1, maximum: 2147483647 }
        recorded_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        completed: { type: boolean }
        ignored: { type: boolean, description: '目标已达到，新请求未增加次数；event_id 和 recorded_at 为 null' }
        settlement:
          oneOf:
            - $ref: '#/components/schemas/TaskSettlement'
            - { type: 'null' }

