n": "NOT_FOUND for absent/inactive member or unavailable space"}, "409": {"description": "ADMIN_ADJUSTMENT_CONFLICT, WALLET_BALANCE_LIMIT, IDEMPOTENCY_KEY_REUSED"}, "503": {"description": "RESULT_UNKNOWN: retain original key and body"}, "500": {"description": "INTERNAL_ERROR; caller treats uncertain transport/5xx conservatively"}}}}

