    TaskReminderRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [enabled]
          properties: { enabled: { const: false } }
        - type: object
          additionalProperties: false
          required: [enabled, mode, before_minutes]
          properties:
            enabled: { const: true }
            mode: { const: before_deadline }
            before_minutes: { type: integer, minimum: 1, maximum: 10080 }
        - type: object
          additionalProperties: false
          required: [enabled, mode, days_before, at_time]
          properties:
            enabled: { const: true }
            mode: { const: local_time }
            days_before: { type: integer, minimum: 0, maximum: 7 }
            at_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        - type: object
          additionalProperties: false
          required: [enabled, mode, at_local_date, at_time]
          properties:
            enabled: { const: true }
            mode: { const: absolute }
            at_local_date: { type: string, format: date }
            at_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    AnniversaryReminderRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [enabled]
          properties: { enabled: { const: false } }
        - type: object
          additionalProperties: false
          required: [enabled, days_before]
          properties:
            enabled: { const: true }
            days_before:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items: { type: integer, enum: [0, 1, 3, 7, 14, 30] }
            at_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '09:00' }
    ReminderRuleFacts:
      type: object
      description: Immutable facts of one revision. A replay returns these unchanged.
      required: [action, rule_id, seq, target_kind, target_id, enabled, mode, before_minutes, days_before, at_time, at_local_date, offsets, created_at]
      properties:
        action: { const: reminder_rule }
        rule_id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        target_kind: { type: string, enum: [task, anniversary] }
        target_id: { type: string, format: uuid }
        enabled: { type: boolean }
        mode: { type: [string, 'null'], enum: [before_deadline, local_time, absolute, anniversary_offsets, null] }
        before_minutes: { type: [integer, 'null'] }
        days_before: { type: [integer, 'null'] }
        at_time: { type: [string, 'null'] }
        at_local_date: { type: [string, 'null'], format: date }
        offsets:
          type: [array, 'null']
          items: { type: integer }
        created_at: { type: string, format: date-time }
    ReminderRuleCurrent:
      description: Current derived state of the target's rule, separate from any write's facts.
      allOf:
        - { $ref: '#/components/schemas/ReminderRuleFacts' }
        - type: object
          required: [origin, needs_reset, effective_at, offset_effective_at, next_fire_at, fired_this_period]
          properties:
            origin:
              type: string
              enum: [user, successor]
              description: successor is a rule copied from the predecessor when an edit was approved.
            needs_reset:
              type: boolean
              description: >-
                True for an enabled inherited rule that does not fit the new terms, or whose instant had already passed
                when it was copied. It keeps the user's choice, has a null next_fire_at, and generates nothing until set again.
            effective_at: { type: [string, 'null'], format: date-time, description: Task rules only; null when disabled. }
            offset_effective_at:
              type: [array, 'null']
              description: Anniversary rules only, per current offset.
              items:
                type: object
                required: [days_before, effective_at]
                properties:
                  days_before: { type: integer }
                  effective_at: { type: string, format: date-time }
            next_fire_at:
              type: [string, 'null']
              format: date-time
              description: >-
                The instant computed from the rule. It is computed whatever the configuration, so it is not a promise
                that anything will fire: read it together with generation_enabled on the list.
            fired_this_period: { type: [boolean, 'null'], description: Recurring and single tasks; null for anniversaries. }
    ReminderRuleResponse:
      type: object
      required: [mutation, current]
      properties:
        mutation: { $ref: '#/components/schemas/ReminderRuleFacts' }
        current: { $ref: '#/components/schemas/ReminderRuleCurrent' }
