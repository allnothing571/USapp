      additionalProperties: false
      required: [redemptions, next_cursor]
      properties:
        redemptions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Redemption' }
        next_cursor:
          oneOf:
            - { type: string }
            - type: 'null'

