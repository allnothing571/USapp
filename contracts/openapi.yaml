    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, reward_flowers, reward_sunshine]
      allOf:
        - if:
            required: [schedule_type]
            properties:
              schedule_type: { enum: [daily, weekly] }
          then:
            required: [completion_mode, target_count]
            properties:
              completion_mode: { const: count }
              deadline: { type: 'null' }
        - if:
            required: [schedule_type]
            properties:
              schedule_type: { const: custom }
          then:
            required: [completion_mode, target_count, start_date, end_date]
            properties:
              completion_mode: { const: count }
              deadline: { type: 'null' }
          else:
            not:
              anyOf:
                - required: [start_date]
                - required: [end_date]
        - if:
            required: [completion_mode]
            properties:
              completion_mode: { const: count }
          then:
            required: [target_count]
          else:
            properties:
              target_count: { const: 1 }
      properties:
        notify_partner: { type: boolean, description: 'P2-3b optional partner notice. Omitted = false and never remembered; true uses the notify-partner:v1 fingerprint extension.' }
        schedule_type: { type: string, enum: [one_off, daily, weekly, custom], default: one_off, description: '每天重复从发布当日开始，每期固定于北京时间次日 0 点结束；每周重复（0.8.0 起）从发布所在周开始，每期为北京时间周一 0 点至下周一 0 点；custom（0.9.0 起）是一个不重复的日期范围。' }
        start_date: { type: string, format: date, description: 'custom 必填：北京时间开始日期（含），不得早于发布当天。' }
        end_date: { type: string, format: date, description: 'custom 必填：北京时间结束日期（含），不得早于 start_date；于其次日 0 点到期。' }
        completion_mode: { type: string, enum: [single, count], default: single }
        target_count: { type: integer, minimum: 1, maximum: 2147483647, description: 'count 必填；single 只能为 1' }
        title:
          type: string
          description: |
            严格 UTF-8；去掉首尾空白（Unicode Zs）后 1～40 个 Unicode 码点；
            任何位置都不得包含控制字符或换行。服务端保存规范化后的值。
        description:
          type: string
          description: |
            可选；CRLF 先归一为 LF，之后只允许 LF 一种换行，其他控制字符（含单独的 CR）拒绝；
            去掉首尾空白与换行后最多 500 个 Unicode 码点。
        reward_flowers: { type: integer, minimum: 0, maximum: 999 }
        reward_sunshine:
          type: integer
          minimum: 0
          maximum: 100000
          description: 两项奖励至少一项大于 0；只接受 JSON 整数（不接受 1.0、字符串或布尔值）。
        deadline:
          oneOf:
            - $ref: '#/components/schemas/TaskDeadlineInput'
            - type: 'null'

    TaskDeadlineInput:
      type: object
      additionalProperties: false
      required: [local_date]
      description: Asia/Shanghai 本地日期与可选时间；只有日期时截止于次日 0 点（不含）。
      properties:
        local_date: { type: string, format: date, description: 'YYYY-MM-DD' }
        local_time:
          oneOf:
            - { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM' }
            - type: 'null'

    TaskDeadline:
      type: object
      additionalProperties: false
      required: [local_date, local_time, at]
      properties:
        local_date: { type: string, format: date }
        local_time:
          oneOf:
            - { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            - type: 'null'
        at:
          type: string
          format: date-time
          description: 截止时刻（不含），UTC，六位小数秒。

    TaskReaction:
      type: object
      additionalProperties: false
      required: [id, task_id, period_date, author_id, kind, emoji_code, body, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, description: Public root task id }
        period_date: { type: [string, 'null'], format: date }
        author_id: { type: string, format: uuid }
        kind: { type: string, enum: [emoji, text] }
        emoji_code: { type: [string, 'null'], enum: [heart, clap, flower, null] }
        body: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        created_at: { type: string, format: date-time }
    TaskReactionResponse:
      type: object
      additionalProperties: false
      required: [mutation, task]
      properties:
        mutation: { $ref: '#/components/schemas/TaskReaction' }
        task: { $ref: '#/components/schemas/Task' }
    Task:
      type: object
      additionalProperties: false
      required: [id, title, description, creator_id, assignee_id, reward_flowers, reward_sunshine,
                 deadline, status, completed_at, created_at]
      allOf:
        - if:
            required: [schedule_type]
            properties:
              schedule_type: { enum: [daily, weekly] }
          then:
            required: [period_date, completion_mode, target_count, progress_count]
        - if:
            required: [schedule_type]
            properties:
              schedule_type: { const: custom }
          then:
            required: [start_date, deadline, completion_mode, target_count, progress_count]
        - if:
            required: [completion_mode]
            properties:
              completion_mode: { const: count }
          then:
            required: [target_count, progress_count]
      properties:
        reaction:
          oneOf:
            - { $ref: '#/components/schemas/TaskReaction' }
            - { type: 'null' }
        schedule_type: { type: string, enum: [one_off, daily, weekly, custom], description: '一次性任务省略；daily/weekly 的 id 是稳定的模板 id；custom 是单个日期范围任务。' }
        start_date: { type: string, format: date, description: 'custom 的开始日期（含）；结束日期见 deadline.local_date。' }
        period_date: { type: string, format: date, description: '周期标识：daily 为北京时间日期，weekly 为该周周一（周日见 deadline.local_date）；与 id 共同标识一条历史记录。' }
        completion_mode: { type: string, enum: [single, count], description: 'single 响应省略此字段，保留原响应形状' }
        target_count: { type: integer, minimum: 1, maximum: 2147483647 }
        progress_count: { type: integer, minimum: 0, maximum: 2147483647, description: 当前已确认进度，不超过目标 }
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        creator_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid }
        reward_flowers: { type: integer, minimum: 0, maximum: 999 }
        reward_sunshine: { type: integer, minimum: 0, maximum: 100000 }
        deadline:
          oneOf:
            - $ref: '#/components/schemas/TaskDeadline'
            - type: 'null'
        status:
          type: string
          enum: [open, completed, expired, upcoming, cancelled, superseded]
          description: |
            由服务端按读取时刻推导；有完成记录即为 completed。upcoming（0.9.0 起）表示 custom 尚未到开始日期。
            cancelled / superseded（0.10.0 起）：经确认取消，或经确认修改后由新任务替换；
            优先级 completed > cancelled/superseded > expired > upcoming > open。
        completed_at:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        created_at: { type: string, format: date-time }
        closure:
          $ref: '#/components/schemas/TaskClosure'
        replaces:
          type: string
          format: uuid
          description: 本任务是经确认修改后的新任务时，被替换的原任务 id。
        pending_change:
          $ref: '#/components/schemas/TaskPendingChange'

    TaskClosure:
      type: object
      additionalProperties: false
      required: [reason, closed_at, replaced_by]
      description: |
        0.10.0 起：根任务（重复任务为模板）的关闭记录，当前状态。重复任务在关闭前已结束或已完成的周期仍显示原状态，
        但同样带有该字段，用于区分“周期已完成”与“模板已取消”。
      properties:
        reason: { type: string, enum: [cancelled, superseded] }
        closed_at: { type: string, format: date-time }
        replaced_by:
          oneOf:
            - { type: string, format: uuid }
            - type: 'null'

    TaskChangeTerms:
      type: object
      additionalProperties: false
      required: [title, description, reward_flowers, reward_sunshine, completion_mode, target_count, deadline]
      properties:
        title: { type: string }
        description: { type: string }
        reward_flowers: { type: integer, minimum: 0, maximum: 999 }
        reward_sunshine: { type: integer, minimum: 0, maximum: 100000 }
        completion_mode: { type: string, enum: [single, count] }
        target_count: { type: integer, minimum: 1, maximum: 2147483647 }
        deadline:
          oneOf:
            - type: object
              additionalProperties: false
              required: [local_date, local_time]
              properties:
                local_date: { type: string, format: date }
                local_time:
                  oneOf:
                    - { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                    - type: 'null'
            - type: 'null'
        start_date: { type: string, format: date, description: 'custom 的新开始日期（含）；结束日期见 deadline.local_date。' }

    TaskPendingChange:
      type: object
      additionalProperties: false
      required: [id, kind, proposer_id, created_at, terms, blocked_reason]
      description: 0.10.0 起：待对方确认的变更（当前状态）。只出现在根任务与重复任务的当前周期上。
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [edit, cancel] }
        proposer_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        terms:
          oneOf:
            - $ref: '#/components/schemas/TaskChangeTerms'
            - type: 'null'
        blocked_reason:
          oneOf:
            - { type: string, enum: [progress, completed, expired, closed] }
            - type: 'null'
          description: 现在不能同意的原因（仍可拒绝或撤回）；null 表示可以同意（决定时刻会再次检查）。

    ProposeTaskChangeRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [edit, cancel] }
        terms:
          $ref: '#/components/schemas/CreateTaskRequest'
          description: kind=edit 时必填（完整的新内容，schedule_type 必须与原任务相同）；kind=cancel 时不得提供。

    DecideTaskChangeRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject, withdraw] }

    TaskChangeDecision:
      type: object
      additionalProperties: false
      required: [outcome, decided_by, decided_at, successor_task_id]
      properties:
        outcome: { type: string, enum: [approved, rejected, withdrawn] }
        decided_by: { type: string, format: uuid }
        decided_at: { type: string, format: date-time }
        successor_task_id:
          oneOf:
            - { type: string, format: uuid }
            - type: 'null'

    TaskChange:
      type: object
      additionalProperties: false
      required: [id, task_id, kind, proposer_id, created_at, terms, decision]
      description: 不可变事实。提议响应中 decision 恒为 null；决定响应中为该决定。
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        kind: { type: string, enum: [edit, cancel] }
        proposer_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        terms:
          oneOf:
            - $ref: '#/components/schemas/TaskChangeTerms'
            - type: 'null'
        decision:
          oneOf:
            - $ref: '#/components/schemas/TaskChangeDecision'
            - type: 'null'

    TaskChangeResponse:
      type: object
      additionalProperties: false
      required: [change, task, successor]
      description: change 是不可变事实；task（原根任务的当前周期/当前状态）与 successor 是读取时的当前状态。
      properties:
        change: { $ref: '#/components/schemas/TaskChange' }
        task: { $ref: '#/components/schemas/Task' }
        successor:
          oneOf:
            - $ref: '#/components/schemas/Task'
            - type: 'null'

    TaskResponse:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/Task' }

    TaskPublishResponse:
      type: object
      additionalProperties: false
      required: [task, notification]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        notification: { $ref: '#/components/schemas/OptionalNotificationResult' }

    AvatarPurchaseRequest:
      type: object
      additionalProperties: false
      required: [item_id, expected_version]
      properties:
        item_id: { type: string, format: uuid }
        expected_version: { type: integer, minimum: 1 }
    AvatarPurchase:
      type: object
      additionalProperties: false
      description: Immutable original facts, identical on every replay.
      required: [id, item_id, item_version, name, category, asset_key, price_sunshine, debited_sunshine, sunshine_balance_after, operation_id, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        item_version: { type: integer, minimum: 1 }
        name: { type: string }
        category: { type: string, enum: [hair, clothes, expression, hat, handheld, accessory] }
        asset_key: { type: string }
        price_sunshine: { type: integer, minimum: 1, maximum: 9999 }
        debited_sunshine: { type: integer, minimum: 1, maximum: 9999 }
        sunshine_balance_after: { type: integer, minimum: 0, description: The balance right after this debit, from its ledger entry. }
        operation_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AvatarCurrentItem:
      type: object
      description: Today's catalog view of an item (it may have been repriced, renamed or unlisted since the purchase).
      required: [id, category, starter, version, name, price_sunshine, listed, asset]
    AvatarPurchaseResponse:
      type: object
      additionalProperties: false
      required: [replayed, purchase, current]
      properties:
        replayed: { type: boolean }
        purchase: { $ref: '#/components/schemas/AvatarPurchase' }
        current:
          type: object
          additionalProperties: false
          description: Read when this response was made; not the post-purchase state.
          required: [sunshine_balance, item]
          properties:
            sunshine_balance: { type: integer, minimum: 0 }
            item: { $ref: '#/components/schemas/AvatarCurrentItem' }
    AvatarOwnedListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purchase, current_item]
            properties:
              purchase: { $ref: '#/components/schemas/AvatarPurchase' }
              current_item: { $ref: '#/components/schemas/AvatarCurrentItem' }
        next_cursor: { type: [string, 'null'], maxLength: 512 }
    AvatarAsset:
      type: object
      additionalProperties: false
      required: [key, format, layers, covers_hair_top, accessory_position]
      properties:
        key: { type: string, pattern: '^[a-z]+\.[a-z0-9_]{1,40}\.v[1-9][0-9]{0,2}$' }
        format: { type: string, enum: [svg, webp] }
        layers: { type: array, items: { type: string, enum: [main, back, front, front_under_hat] } }
        covers_hair_top: { type: [boolean, 'null'], description: Hats only. }
        accessory_position: { type: [string, 'null'], enum: [behind_body, neck, face, above_hat, null], description: Accessories only. }
    AvatarItem:
      type: object
      additionalProperties: false
      required: [id, category, starter, version, name, price_sunshine, asset]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [hair, clothes, expression, hat, handheld, accessory] }
        starter: { type: boolean }
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 20 }
        price_sunshine: { type: [integer, 'null'], minimum: 1, maximum: 9999, description: Null exactly for a starter item. }
        asset: { $ref: '#/components/schemas/AvatarAsset' }
    AvatarCatalogResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AvatarItem' } }
    SharedRoomPlacement:
      type: object
      additionalProperties: false
      required: [item, x, y]
      properties:
        item: { type: string, enum: [table, lamp, plant, rug, bookshelf, armchair, vase] }
        x: { type: integer, minimum: 0, maximum: 3 }
        y: { type: integer, minimum: 0, maximum: 2 }

    SharedRoomAvatarSharing:
      type: object
      additionalProperties: false
      required: [share_avatar]
      properties:
        share_avatar: { type: boolean }

    RoomSide:
      type: string
      enum: [left, right]

    RoomPositions:
      type: object
      required: [side, paired, pending]
      properties:
        side: { $ref: '#/components/schemas/RoomSide' }
        paired: { type: boolean }
        pending:
          type: [object, 'null']
          required: [id, incoming]
          properties:
            id: { type: string, format: uuid }
            incoming: { type: boolean }

    RoomPositionAction:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [request, accept, decline, cancel] }

    SharedRoom:
      type: object
      required: [version, layout, share_avatar, partner_appearance, furniture, positions]
      properties:
        positions: { $ref: '#/components/schemas/RoomPositions' }
        version: { type: integer, minimum: 0, maximum: 1000000000 }
        layout:
          type: array
          description: One placement per furniture kind and per cell.
          maxItems: 4
          items: { $ref: '#/components/schemas/SharedRoomPlacement' }
        share_avatar: { type: boolean }
        furniture:
          type: array
          maxItems: 3
          items:
            type: object
            required: [item, price, owned]
            properties:
              item: { type: string, enum: [bookshelf, armchair, vase] }
              price: { type: integer, minimum: 1, maximum: 9999 }
              owned: { type: boolean }
        partner_appearance:
          oneOf:
            - $ref: '#/components/schemas/AvatarAppearanceResponse/properties/appearance'
            - type: 'null'

    SharedGardenWatering:
      type: object
      additionalProperties: false
      required: [watering_date]
      properties:
        watering_date: { type: string, format: date }

    SharedGarden:
      type: object
      additionalProperties: false
      required: [watering_date, total_waterings, watered_today, partner_watered_today]
      properties:
        watering_date: { type: string, format: date }
        total_waterings: { type: integer, format: int64, minimum: 0 }
        watered_today: { type: boolean }
        partner_watered_today: { type: boolean }
        recent_waterings:
          description: Seven Beijing dates, newest first including today. A day without a watering is included with false flags.
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [watering_date, watered, partner_watered]
            properties:
              watering_date: { type: string, format: date }
              watered: { type: boolean }
              partner_watered: { type: boolean }

    SharedGardenMonth:
      type: object
      additionalProperties: false
      required: [month, current_month, days]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        current_month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        days:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: object
            additionalProperties: false
            required: [watering_date, watered, partner_watered]
            properties:
              watering_date: { type: string, format: date }
              watered: { type: boolean }
              partner_watered: { type: boolean }

    AvatarAppearanceResponse:
      type: object
      additionalProperties: false
      required: [appearance]
      properties:
        appearance:
          type: object
          additionalProperties: false
          required: [source, complete, starter_version, loadout_version, slots]
          properties:
            character_gender: { type: string, enum: [female, male], description: Saved avatar styling choice. Omitted if unset. }
            hair_hidden: { type: boolean, description: Hide the equipped hair to render the bald base. Omitted if unset. }
            source: { type: string, enum: [starter_defaults, saved_loadout], description: 'saved_loadout is B3 (0.44.0).' }
            loadout_version: { type: integer, minimum: 0, description: 'B3: the latest saved version; 0 before the first save.' }
            complete: { type: boolean }
            starter_version: { type: [integer, 'null'], minimum: 1 }
            slots:
              type: object
              additionalProperties: false
              required: [hair, clothes, expression, hat, handheld, accessory]
              properties:
                hair: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AvatarItem' }] }
                clothes: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AvatarItem' }] }
                expression: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AvatarItem' }] }
                hat: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AvatarItem' }] }
                handheld: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AvatarItem' }] }
                accessory: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AvatarItem' }] }
    AvatarLoadoutSlots:
      type: object
      additionalProperties: false
      required: [hair, clothes, expression, hat, handheld, accessory]
      properties:
        hair: { type: [string, 'null'], format: uuid }
        clothes: { type: [string, 'null'], format: uuid }
        expression: { type: [string, 'null'], format: uuid }
        hat: { type: [string, 'null'], format: uuid }
        handheld: { type: [string, 'null'], format: uuid }
        accessory: { type: [string, 'null'], format: uuid }
    AvatarLoadoutRequest:
      type: object
      additionalProperties: false
      required: [expected_version, slots]
      properties:
        character_gender: { type: string, enum: [female, male], description: Preserve existing styling when omitted. }
        hair_hidden: { type: boolean, description: Preserve existing visibility when omitted. Does not change the equipped item. }
        expected_version: { type: integer, minimum: 0, description: The caller's current loadout version; 0 before the first save. }
        slots:
          allOf:
            - $ref: '#/components/schemas/AvatarLoadoutSlots'
          description: |
            All six keys. null in hair, clothes or expression means "use the configured default", resolved during the write from
            one starter configuration and stored as a concrete id; null in hat, handheld or accessory means empty.
    AvatarLoadoutResponse:
      type: object
      additionalProperties: false
      required: [replayed, loadout, current]
      properties:
        replayed: { type: boolean }
        loadout:
          type: object
          additionalProperties: false
          description: Immutable facts of the original save, identical on every replay.
          required: [id, version, slots, requested, starter_version, created_at]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            slots: { $ref: '#/components/schemas/AvatarLoadoutSlots' }
            requested: { $ref: '#/components/schemas/AvatarLoadoutSlots' }
            character_gender: { type: string, enum: [female, male] }
            hair_hidden: { type: boolean }
            starter_version: { type: [integer, 'null'], minimum: 1, description: The configuration the defaults came from; null when none was needed. }
            created_at: { type: string, format: date-time }
        current:
          description: Read after the commit; not part of the original facts. Null only if that read failed.
          oneOf:
            - type: 'null'
            - type: object
              required: [appearance]
              properties:
                appearance: { type: object }
    AchievementSnapshot:
      type: object
      additionalProperties: false
      required: [enabled, enabled_at, timezone, total_completed, longest_streak, badges]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: [string, 'null'], format: date-time }
        timezone: { type: string, const: Asia/Shanghai }
        total_completed: { type: integer, minimum: 0 }
        longest_streak: { type: integer, minimum: 0 }
        badges:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [code, metric, target, progress, earned_at]
            properties:
              code: { type: string, enum: [first_task, task_10, task_50, streak_3, streak_7] }
              metric: { type: string, enum: [total, streak] }
              target: { type: integer, enum: [1, 3, 7, 10, 50] }
              progress: { type: integer, minimum: 0, maximum: 50 }
              earned_at: { type: [string, 'null'], format: date-time }

    UserDataExport:
      type: object
      additionalProperties: false
      description: schema_version 1. Every array is in a stable order; an empty section is []. Field allowlist per section in docs/user-data-export-design.md Section 4.
      required: [export, account, space, tasks, task_completions, task_progress, task_changes, task_closures, task_reactions, reminder_rules,
        wallet, reward_products, reward_product_revisions, reward_redemptions, reward_redemption_events, messages, anniversaries,
        anniversary_revisions, anniversary_proposals, anniversary_home_pin, memories, memory_revisions, memory_proposals, albums,
        album_revisions, album_proposals, album_items, shared_plans, shared_plan_events, avatar_purchases, avatar_loadouts, achievements]
      properties:
        export:
          type: object
          additionalProperties: false
          required: [format, schema_version, generated_at, subject_user_id, scope, photos_included, complete]
          properties:
            format: { type: string, const: usapp-user-export }
            schema_version: { type: integer, const: 1 }
            generated_at: { type: string, format: date-time }
            subject_user_id: { type: string, format: uuid }
            scope: { type: string, const: own_and_shared_space }
            photos_included: { type: boolean, const: false }
            complete: { type: boolean, const: true }
        account:
          type: object
          additionalProperties: false
          required: [id, email, display_name, status, created_at]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
            status: { type: string }
            created_at: { type: string, format: date-time }
        space:
          type: object
          additionalProperties: false
          required: [id, name, timezone, created_by_user_id, created_at, members]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            timezone: { type: string }
            created_by_user_id: { type: [string, 'null'], format: uuid }
            created_at: { type: string, format: date-time }
            members:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [user_id, slot, display_name, joined_at]
                properties:
                  user_id: { type: string, format: uuid }
                  slot: { type: integer, enum: [1, 2] }
                  display_name: { type: string }
                  joined_at: { type: string, format: date-time }
        tasks: { $ref: '#/components/schemas/ExportRecords' }
        task_completions: { $ref: '#/components/schemas/ExportRecords' }
        task_progress: { $ref: '#/components/schemas/ExportRecords' }
        task_changes: { $ref: '#/components/schemas/ExportRecords' }
        task_closures: { $ref: '#/components/schemas/ExportRecords' }
        task_reactions: { $ref: '#/components/schemas/ExportRecords' }
        reminder_rules: { $ref: '#/components/schemas/ExportRecords' }
        wallet:
          type: object
          additionalProperties: false
          required: [balances, ledger]
          properties:
            balances:
              type: object
              additionalProperties: false
              required: [flower, sunshine]
              properties:
                flower: { type: integer, minimum: 0 }
                sunshine: { type: integer, minimum: 0 }
            ledger: { $ref: '#/components/schemas/ExportRecords' }
        reward_products: { $ref: '#/components/schemas/ExportRecords' }
        reward_product_revisions: { $ref: '#/components/schemas/ExportRecords' }
        reward_redemptions: { $ref: '#/components/schemas/ExportRecords' }
