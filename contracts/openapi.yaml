    MediaDeletionContext:
      type: object
      additionalProperties: false
      required: [kind, relation, target_id, label, position]
      description: |
        Where the photo is bound. `memory` or `album`: a parent the caller can read, with its current title or name. `unavailable`: the parent
        cannot be read, so its kind, id and text are all withheld. `none`: not bound; a pending request does not count.
      properties:
        kind: { type: string, enum: [memory, album, unavailable, none] }
        relation:
          type: [string, 'null']
          enum: [current, former, null]
          description: 'memory: in its current revision, or only in an older one. album: an active item, or removed. Null for unavailable and none.'
        target_id: { type: [string, 'null'], format: uuid, description: Null unless kind is memory or album. }
        label: { type: [string, 'null'], description: The current memory title or album name. Null unless kind is memory or album. }
        position:
          type: [integer, 'null']
          minimum: 1
          maximum: 9
          description: The position in the memory's current revision. Null otherwise, including every album photo.
