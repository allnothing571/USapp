                 created_at, updated_at]
      description: 当前状态（读取时刻）。creator 为上架的一方，owner 为将来兑换的一方（对方）；两者不可变。
      properties:
        id: { type: string, format: uuid }
        creator_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price_flowers: { type: integer, minimum: 1, maximum: 999 }
        redemption_mode: { type: string, enum: [direct, request] }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RewardProductMutation:
      type: object
      additionalProperties: false
      required: [action, version, actor_id, title, description, price_flowers, redemption_mode, status, created_at]
      description: 一次上架/修改/下架写入的不可变事实（对应版本的完整内容）；同键重放返回同一事实。
      properties:
        action: { type: string, enum: [create, edit, archive] }
        version: { type: integer, minimum: 1 }
        actor_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price_flowers: { type: integer, minimum: 1, maximum: 999 }
        redemption_mode: { type: string, enum: [direct, request] }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }

    RewardProductMutationResponse:
      type: object
      additionalProperties: false
      required: [mutation, product]
      description: mutation 是不可变事实；product 是读取时刻的当前状态（重放时可能已被之后的修改或下架改变）。
      properties:
        mutation: { $ref: '#/components/schemas/RewardProductMutation' }
        product: { $ref: '#/components/schemas/RewardProduct' }

    RewardProductResponse:
      type: object
      additionalProperties: false
      required: [product]
      properties:
        product: { $ref: '#/components/schemas/RewardProduct' }

    RewardProductListResponse:
      type: object
      additionalProperties: false
      required: [products, next_cursor]
      properties:
        products:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RewardProduct' }
        next_cursor:
          oneOf:
            - { type: string }
            - type: 'null'

    RedeemRewardProductRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1, description: 用户确认兑换时页面显示的奖励版本。 }

    Redemption:
      type: object
      additionalProperties: false
      required: [id, product_id, product_version, creator_id, redeemer_id, title, description, price_flowers,
                 redemption_mode, operation_id, status, created_at, fulfilled_at, fulfilled_by]
      description: 兑换时的不可变快照；status/fulfilled_* 为读取时刻的当前状态。
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_version: { type: integer, minimum: 1 }
        creator_id: { type: string, format: uuid }
        redeemer_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price_flowers: { type: integer, minimum: 1, maximum: 999 }
        redemption_mode: { type: string, enum: [direct, request] }
        operation_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [pending_confirmation, pending_fulfillment, fulfilled, cancelled] }
        cancel_reason: { type: [string, 'null'], enum: [rejected, withdrawn, mutual, admin, null] }
        cancelled_at: { type: [string, 'null'], format: date-time }
        pending_cancellation:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, proposed_by]
              properties:
                id: { type: string, format: uuid }
                proposed_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        fulfilled_at:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        fulfilled_by:
          oneOf:
            - { type: string, format: uuid }
            - type: 'null'

    RedemptionMutation:
      type: object
      description: 一次兑换（action=redeem：快照与扣款 debited_flowers）或履约（action=fulfill）写入的不可变事实；同键重放返回同一事实。
      required: [action, redemption_id]
      properties:
        action: { type: string, enum: [redeem, fulfill, confirm, reject, withdraw, cancel_propose, cancel_approve, cancel_reject, cancel_withdraw] }
        redemption_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_version: { type: integer }
        title: { type: string }
        description: { type: string }
        price_flowers: { type: integer }
        redemption_mode: { type: string }
        creator_id: { type: string, format: uuid }
        redeemer_id: { type: string, format: uuid }
        operation_id: { type: [string, 'null'], format: uuid }
        refunded_flowers: { type: integer }
        event_id: { type: string, format: uuid }
        proposal_id: { type: [string, 'null'], format: uuid }
        actor_id: { type: string, format: uuid }
        debited_flowers: { type: integer }
        created_at: { type: string, format: date-time }
        fulfilled_by: { type: string, format: uuid }
        fulfilled_at: { type: string, format: date-time }

    RedemptionMutationResponse:
      type: object
      additionalProperties: false
      required: [mutation, redemption]
      description: mutation 是不可变事实；redemption 是读取时刻的当前状态。不含余额（余额另读 GET /api/v1/wallet）。
      properties:
        mutation: { $ref: '#/components/schemas/RedemptionMutation' }
        redemption: { $ref: '#/components/schemas/Redemption' }

    RedemptionResponse:
