  /api/v1/rewards/products/{productId}/redemptions:
    post:
      tags: [rewards]
      operationId: redeemRewardProduct
      summary: 对方（拥有者）兑换或申请一件奖励（按商品方式处理）
      description: |
        - M9 extension: request-mode products are now accepted: snapshot only, no debit/reservation,
          status pending_confirmation. The immutable redeem mutation has debited_flowers=0 and operation_id=null.
          Direct mode retains the M8 behavior. Request confirmation uses the transitions endpoint.
        - 正式会话、精确 Origin、会话绑定的 CSRF；必须带 Idempotency-Key。只有该奖励的拥有者（对方）可以兑换；
          上架的一方兑换 403 REDEMPTION_FORBIDDEN；其他空间 404 PRODUCT_NOT_FOUND。
        - expected_version 是页面显示并经用户确认的奖励版本；版本已更新 409 PRODUCT_VERSION_CONFLICT（不会按新价格扣款），
          已下架 409 PRODUCT_ARCHIVED；申请兑换方式保存申请但不扣款（M9）。
        - 同一事务内：校验余额（不足 409 INSUFFICIENT_BALANCE，不预留、不写入）、扣除 price_flowers 小红花、
          写入不可变的兑换快照（状态 pending_fulfillment）与审计。不会重复扣款，余额不会为负，不涉及阳光值。
        - 同键同内容重放返回原兑换的不可变事实（即使之后奖励被修改、下架或已履约）；redemption 为当前状态；
          同键不同内容 409 IDEMPOTENCY_KEY_REUSED。响应不含余额。
        - 提交结果不明为 503 RESULT_UNKNOWN；保留同一键显式重试，不会重复扣款。
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRewardProductRequest'
      responses:
        '201':
          description: 已兑换并扣款
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionMutationResponse'
        '200':
          description: 同键重放
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'

  /api/v1/rewards/redemptions:
    get:
      tags: [rewards]
      operationId: listRedemptions
      summary: 调用者作为兑换方或上架方的兑换记录（游标分页）
      description: |
        - 按不可变的 (created_at, id) 从新到旧；next_cursor 为 null 表示没有更多；游标或 limit 无效返回 400。
        - 记录是兑换时的快照，不随之后的修改或下架变化；状态（是否已履约）为读取时刻的当前状态。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z_[0-9a-f-]{36}$' }
      responses:
        '200':
          description: 列表
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards/redemptions/{redemptionId}:
    get:
      tags: [rewards]
      operationId: getRedemption
      summary: 兑换详情（只有兑换方与上架方可读）
      parameters:
        - name: redemptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 详情
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards/redemptions/{redemptionId}/fulfillment:
    post:
      tags: [rewards]
      operationId: fulfillRedemption
      summary: 上架的一方确认已履约（最终状态，不再扣款）
      description: |
        - 必须带 Idempotency-Key；请求体为空或 {}。只有上架的一方可以确认，兑换方 403 REDEMPTION_FORBIDDEN；
          已履约 409 REDEMPTION_ALREADY_FULFILLED。不写入任何钱包数据。
        - 同键重放返回原履约的不可变事实（200）；提交结果不明为 503 RESULT_UNKNOWN。
      parameters:
        - name: redemptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已确认履约，或同键重放
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ResultUnknown'

  /api/v1/rewards/redemptions/{redemptionId}/transitions:
    post:
      tags: [rewards]
      operationId: transitionRedemption
      summary: Confirm, reject or withdraw a request; mutually cancel a paid redemption
      description: |
        Request mode snapshots terms without funds reservation. Only the creator may confirm/reject;
        only the redeemer may withdraw. Confirm debits the original price, even after edit/archive;
        INSUFFICIENT_BALANCE leaves pending_confirmation unchanged.
        Either party may propose cancellation while pending_fulfillment. The other may approve/reject;
        only the proposer may withdraw it. Decisions require the captured proposal_id, preventing stale
        decisions from applying to a newer proposal. Approval refunds the full price exactly once.
        WALLET_BALANCE_LIMIT leaves the cancellation pending, without a partial refund.
        Fulfillment and cancellation use one lock; fulfillment can win over a pending proposal.
        Fulfilled/cancelled are final. State changes return REDEMPTION_STATE_CONFLICT (409).
        Same actor/key and body replay immutable mutation facts plus current state; different body
        returns IDEMPOTENCY_KEY_REUSED. Unconfirmed commit returns RESULT_UNKNOWN; explicitly retry
        the same key. No balances are exposed. All writes require Origin and session-bound CSRF.
      parameters:
        - name: redemptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { type: string, enum: [confirm, reject, withdraw, cancel_propose] }
                - type: object
                  additionalProperties: false
                  required: [action, proposal_id]
                  properties:
                    action: { type: string, enum: [cancel_approve, cancel_reject, cancel_withdraw] }
                    proposal_id: { type: string, format: uuid }
      responses:
        '200':
          description: Confirmed transition or same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/messages:
    post:
      tags: [messages]
      operationId: createMessage
      summary: Write a plain-text message to the partner (P2-1)
      description: |
        Either member writes; the recipient is always the other member (PARTNER_REQUIRED without one).
        Body: 1-500 code points, LF allowed (CRLF normalised), task-description character rules.
        Same author/key and body replay the original mutation with 200; a different body returns
        IDEMPOTENCY_KEY_REUSED. An unconfirmed commit returns RESULT_UNKNOWN: retry with the same key.
        Messages are append-only in P2-1 (no edit or delete). Requires Origin and session-bound CSRF.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageTextRequest' }
      responses:
        '201':
          description: Message created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }
    get:
      tags: [messages]
      operationId: listMessages
      summary: Message history of the caller's space, newest first
      description: |
        Both members see every message of their space with its reply. `from=partner` lists only
        messages written by the partner (Home uses limit=1). Pages in (created_at DESC, id DESC);
        pass `next_cursor` back unchanged. Pages are not snapshots; new messages appear only before
        the first page.
      parameters:
        - name: from
          in: query
          schema: { type: string, enum: [all, partner], default: all }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TaskCursor'
      responses:
        '200':
          description: One page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/messages/{messageId}:
    get:
      tags: [messages]
      operationId: getMessage
      summary: One message of the caller's space (MESSAGE_NOT_FOUND otherwise)
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The message with its reply
          headers:
