        actor_id: { type: [string, 'null'], format: uuid, description: 'Null for reminders and security.wallet_adjusted, security.redemption_cancelled, security.session_created. Admin identity and private reasons are never member actors or response fields.' }
        target_kind: { type: string, enum: [task, reward, anniversary, message, memory, shared_plan, album, account], description: 'account is a mandatory recipient-only security notice and opens the inbox. It is available without a space. Login has no token/IP/agent fields; no new login backfill. Financial retries do not create another notice. Other targets retain current authorization.' }
        target_id: { type: string, format: uuid }
