          description: The item
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnniversaryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/anniversaries/{anniversaryId}/revisions:
    post:
      tags: [anniversaries]
      operationId: editAnniversary
      summary: Creator edit (full terms) against expected_version
      description: |
        Creator only (ANNIVERSARY_EDIT_FORBIDDEN for the partner). Key classification runs first, so a
        retry of a committed edit replays. Then a stale expected_version gives
        ANNIVERSARY_VERSION_CONFLICT, a pending proposal ANNIVERSARY_PROPOSAL_PENDING and unchanged
        terms VALIDATION_ERROR.
      parameters:
        - $ref: '#/components/parameters/AnniversaryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnniversaryEditRequest' }
      responses:
        '201':
          description: New version
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnniversaryMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnniversaryMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/anniversaries/{anniversaryId}/proposals:
    post:
      tags: [anniversaries]
      operationId: proposeAnniversaryEdit
      summary: Partner proposes a full replacement against expected_version
      description: |
        Partner only (the creator gets ANNIVERSARY_EDIT_FORBIDDEN). At most one pending proposal per
        item (ANNIVERSARY_PROPOSAL_PENDING); expected_version must be current
        (ANNIVERSARY_VERSION_CONFLICT); the terms must differ (VALIDATION_ERROR).
      parameters:
        - $ref: '#/components/parameters/AnniversaryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnniversaryRevisionRequest' }
      responses:
        '201':
          description: Proposal created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnniversaryMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnniversaryMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/anniversaries/{anniversaryId}/proposals/{proposalId}/decision:
    post:
      tags: [anniversaries]
      operationId: decideAnniversaryProposal
      summary: Creator approves or rejects; proposer withdraws
      description: |
        approve/reject: creator only; withdraw: proposer only (ANNIVERSARY_EDIT_FORBIDDEN otherwise).
        Exactly one decision per proposal (ANNIVERSARY_PROPOSAL_DECIDED for the losers). Approval
        appends version base_version + 1 with exactly the proposed terms; a stale base gives
        ANNIVERSARY_PROPOSAL_STALE. A proposal of another item gives ANNIVERSARY_PROPOSAL_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/AnniversaryId'
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnniversaryDecisionRequest' }
      responses:
        '200':
          description: Decided, or same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnniversaryMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

