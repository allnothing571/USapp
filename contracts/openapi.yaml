        - type: object
          properties:
            notify_partner: { type: boolean }
      unevaluatedProperties: false

    AnniversaryRevisionRequest:
      allOf:
        - $ref: '#/components/schemas/AnniversaryTerms'
        - type: object
          required: [expected_version]
          properties:
            expected_version: { type: integer, minimum: 1 }
      unevaluatedProperties: false

    AnniversaryEditRequest:
      description: Creator direct edit; unlike a proposal it may carry the optional notify_partner.
      allOf:
        - $ref: '#/components/schemas/AnniversaryTerms'
        - type: object
          required: [expected_version]
          properties:
            expected_version: { type: integer, minimum: 1 }
            notify_partner: { type: boolean }
      unevaluatedProperties: false

    AnniversaryDecisionRequest:
      type: object
      additionalProperties: false
      required: [outcome]
