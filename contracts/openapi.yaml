        current_session: { type: boolean }
        provider: { type: string, enum: [fcm, mozilla, apple, windows] }
        user_agent_family: { type: [string, 'null'] }
        endpoint_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: Only in register and revoke responses }
        vapid_key_id: { type: string, pattern: '^[0-9a-f]{64}$', description: Only in register and revoke responses }

    PushRegistrationResponse:
