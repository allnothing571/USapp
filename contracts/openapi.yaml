    AnniversaryTerms:
      type: object
      required: [title, date, kind]
      properties:
        title: { type: string, minLength: 1, maxLength: 40 }
        date: { type: string, format: date, description: 'Civil date, 1900-01-01..2199-12-31' }
        kind: { type: string, enum: [anniversary, countdown] }
        note: { type: string, maxLength: 500, default: '' }

    CreateAnniversaryRequest:
