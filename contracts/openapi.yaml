      responses:
        '200': {"description":"Applied or replayed mutation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SharedPlanMutation"}}}}
        '201': {"description":"Created","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SharedPlanMutation"}}}}
        '400': {"description":"Invalid request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '401': {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '403': {"description":"Forbidden or invalid request origin or CSRF token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '404': {"description":"Plan or proposal unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '409': {"description":"Plan state, body version or idempotency conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '503': {"description":"Write result unconfirmed","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/shared-plans/{planId}:
    get:
      operationId: getSharedPlan
