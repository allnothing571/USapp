      properties:
        title: { type: string }
        description: { type: string }
        price_flowers: { type: integer, minimum: 1, maximum: 999, description: '价格只用小红花；不允许免费，也不支持阳光值定价。' }
        redemption_mode: { type: string, enum: [direct, request], description: 只保存，供之后的兑换里程碑使用；M7 不实现兑换。 }

    EditRewardProductRequest:
      type: object
