  /api/admin/v1/couples/{coupleId}/shared-plans:
    get:
      tags: [admin]
      operationId: adminListCoupleSharedPlans
      summary: Read-only shared-plan inspection for one selected couple
      description: |
        AdminFilter requires peer CIDR, admin surface header and independent admin authentication.
        One SQL snapshot per response, exact couple scope. Current status/body versions project usapp_shared_plan_read.
        No writes, keys, raw request receipts, notifications, memory links/ids/text or media references.
        Plan text is independent and remains under O12 even if an associated memory is deleted or erased.
        List includes title and versions only, newest (created_at,id), with exact-microsecond cursor bound to couple; separate pages are not one snapshot.
      parameters:
        - { name: coupleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 160, pattern: '^p1\.[1-9][0-9]{0,18}\.[0-9a-f-]{36}\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: Read-only snapshot (existing empty couple returns an empty list)
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSharedPlanPage' }
        '400': { description: VALIDATION_ERROR (malformed id, limit or cursor, including a cursor of another couple) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SPACE_NOT_FOUND or NOT_FOUND (foreign and unknown plan have the same answer) }
  /api/admin/v1/couples/{coupleId}/shared-plans/{planId}:
    get:
      tags: [admin]
      operationId: adminGetCoupleSharedPlan
      summary: Read-only shared-plan inspection for one selected couple
      description: |
        AdminFilter requires peer CIDR, admin surface header and independent admin authentication.
        One SQL snapshot per response, exact couple scope. Current status/body versions project usapp_shared_plan_read.
        No writes, keys, raw request receipts, notifications, memory links/ids/text or media references.
        Plan text is independent and remains under O12 even if an associated memory is deleted or erased.
        Detail includes five-field current body and newest 50 events by seq, plus decimal-string total; history is not a current pending-action queue.
      parameters:
        - { name: coupleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Read-only snapshot (existing empty couple returns an empty list)
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSharedPlanDetail' }
        '400': { description: VALIDATION_ERROR (malformed id, limit or cursor, including a cursor of another couple) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SPACE_NOT_FOUND or NOT_FOUND (foreign and unknown plan have the same answer) }

  /api/admin/v1/couples/{coupleId}/tasks:
    get:
      tags: [admin]
      operationId: adminListCoupleTasks
      summary: The stored task rows of one selected couple, newest first (admin, read-only, 0.48.0)
      description: |
        AdminFilter: peer CIDR, the admin surface header and an admin session; an ordinary user session never authorizes it.
        Lists stored rows only: plain tasks (one_off/custom), recurring templates (daily/weekly) and stored periods of a
        template. A period that was never stored (no action in it) is not a row and is not listed. No time window: old
        expired, completed and closed rows are included. status uses the same expression as the public task read
        (completed, cancelled, superseded, expired, upcoming, open); for a template, open means its schedule is not closed.
        Keyset pagination by (created_at, id) descending; a cursor is valid only for the same couple and kind filter.
        Each page is one statement (space existence and the page share one snapshot); there is no snapshot across pages,
        so rows created after the first page do not appear on later pages and nothing repeats. Rewards are decimal
        strings. Unknown couple: 404 SPACE_NOT_FOUND; existing couple without tasks: 200 with no items. Writes nothing.
        The public /api/v1/tasks reads are unchanged. See docs/admin-task-inspection.md.
      parameters:
        - { name: coupleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [task, template, period] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 160, pattern: '^t1\.(all|task|template|period)\.[1-9][0-9]{0,18}\.[0-9a-f-]{36}\.[0-9a-f-]{36}$' } }
      responses:
        '200':
          description: One page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTaskPage' }
        '400': { description: VALIDATION_ERROR (malformed couple id, kind, limit or cursor; cursor of another couple or filter) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SPACE_NOT_FOUND (no such couple) }
  /api/admin/v1/couples/{coupleId}/tasks/{taskId}:
    get:
      tags: [admin]
      operationId: adminGetCoupleTask
      summary: One stored task row of the selected couple with its history (admin, read-only, 0.48.0)
      description: |
        One statement (one snapshot): the row, its completion, its newest 200 counted progress events (total always given),
        its reaction, the change proposals and decisions of its root (a period's changes and closure live on its template;
        changes.owner_task_id names the row they belong to; newest 100, total always given), the root's closure with its
        successor, and the task it replaced. Referenced ids are rows of the same couple. Excluded: idempotency keys,
        fingerprints, wallet operation ids, raw requests, notifications and reminder rules. A task of another couple
        answers exactly like an unknown task (404 TASK_NOT_FOUND). Writes nothing.
      parameters:
        - { name: coupleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detail
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTaskDetail' }
        '400': { description: VALIDATION_ERROR (malformed couple or task id) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SPACE_NOT_FOUND (no such couple) or TASK_NOT_FOUND (no such task in this couple) }

  /api/admin/v1/couples:
    get:
      tags: [admin]
      operationId: adminListCouples
      summary: 情侣空间列表骨架（只读分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCoupleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/audit-logs:
    get:
      tags: [admin]
      operationId: adminListAuditLogs
      summary: 审计日志骨架（只读分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditLogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/avatar/catalog:
    get:
      tags: [avatar]
      operationId: getAvatarCatalog
      summary: The global avatar catalog (Phase 4 B1, 0.42.0)
      description: |
        Listed items with their current revision, for any signed-in user; the catalog is global, not per couple. Unlisted items
        are omitted. starter items are free and have price_sunshine null. Asset files are bundled with the app and named
        <asset.key>.<layer>.<asset.format>; no URL or path is ever returned. B1 has no ownership or purchase: nothing here says
        what the caller owns.
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Catalog
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarCatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/shared-room:
    get:
      operationId: getSharedRoom
      summary: Read the current space's layout and a consenting partner's appearance
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Shared room snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedRoom' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveSharedRoom
      summary: Replace the room layout if the expected version still matches
      security: [{ CookieSession: [] }]
      description: Requires same-origin session and CSRF. Furniture kinds and coordinates must be unique within one layout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, layout]
              properties:
                expected_version: { type: integer, minimum: 0, maximum: 999999999 }
                layout:
                  type: array
                  maxItems: 4
                  items: { $ref: '#/components/schemas/SharedRoomPlacement' }
      responses:
        '200':
          description: Layout saved
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer, minimum: 1, maximum: 1000000000 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SHARED_ROOM_VERSION_CONFLICT. Read the latest layout before another save.
        '503':
          description: RESULT_UNKNOWN. Read the room to confirm what was saved.

  /api/v1/shared-room/positions:
    get:
      operationId: getRoomPositions
      summary: Read your room side and the pending swap, if any
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Current room positions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomPositions' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: changeRoomPosition
      summary: Request, accept, decline or cancel a room swap
      description: Same-origin and CSRF required. Repeat the same id and action to confirm an uncertain result.
      security: [{ CookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomPositionAction' }
      responses:
        '200':
          description: Action confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomPositionAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: RESULT_UNKNOWN. Retry the original action or read positions.

  /api/v1/shared-room/furniture/purchases:
    post:
      operationId: buyRoomFurniture
      summary: Purchase a furniture entitlement for the current space
      description: Debits the caller's sunshine once. Both members can place the item after purchase. Retry an unconfirmed result with the same key and item.
      security: [{ CookieSession: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item]
              properties:
                item: { type: string, enum: [bookshelf, armchair, vase] }
      responses:
        '200':
          description: Purchase confirmed or replayed
          content:
            application/json:
              schema:
                type: object
                required: [item, owned]
                properties:
                  item: { type: string, enum: [bookshelf, armchair, vase] }
                  owned: { const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ROOM_FURNITURE_OWNED, INSUFFICIENT_BALANCE or IDEMPOTENCY_KEY_REUSED.
        '503':
          description: RESULT_UNKNOWN. Confirm with the same purchase key.

  /api/v1/shared-room/live:
    get:
      operationId: connectSharedRoom
      summary: Subscribe to room invalidation and opt-in presence over WebSocket
      description: Requires an authenticated member and exact public Origin. Server text frames are ready, room-changed, peer-online and peer-not-visible. Layout updates use the versioned PUT. Connections are scoped to the current API process.
      security: [{ CookieSession: [] }]
      parameters:
        - in: query
          name: presence
          required: false
          schema: { type: string, enum: ['1'] }
      responses:
        '101':
          description: WebSocket upgrade. Unauthorized upgrades are closed before any application data is sent.

  /api/v1/shared-room/avatar-sharing:
    put:
      operationId: setSharedRoomAvatarSharing
      summary: Set the caller's room appearance consent. Defaults to false.
      security: [{ CookieSession: [] }]
      description: Requires same-origin session and CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedRoomAvatarSharing' }
      responses:
        '200':
          description: Consent saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedRoomAvatarSharing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: RESULT_UNKNOWN. Read the room to confirm what was saved.

  /api/v1/shared-garden:
    get:
      operationId: getSharedGarden
      summary: Get the current space's plant progress and today's watering status
      security: [{ CookieSession: [] }]
      description: The watering date uses Asia/Shanghai. Reads do not create a plant or a watering record.
      responses:
        '200':
          description: Shared plant progress
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedGarden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/shared-garden/history:
    get:
      operationId: getSharedGardenMonth
      summary: Read the daily watering flags for one Beijing calendar month
      security: [{ CookieSession: [] }]
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
          description: Defaults to the current Beijing month. Future months are refused.
      responses:
        '200':
          description: Daily flags ordered oldest first, excluding future dates
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedGardenMonth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/shared-garden/watering:
    put:
      operationId: waterSharedGarden
      summary: Record the current member's watering for the displayed date
      description: Requires the same-origin session and CSRF. The same member and date count once. A date that has elapsed is refused even if it was previously watered.
      security: [{ CookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedGardenWatering' }
      responses:
        '200':
          description: Watering for this member and date is confirmed
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedGardenWatering' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SHARED_GARDEN_DATE_CHANGED. Read the current garden before watering again.
        '503':
          description: RESULT_UNKNOWN. Read the current garden to check whether watering was recorded.

  /api/v1/avatar:
    get:
      tags: [avatar]
      operationId: getMyAvatar
      summary: The caller's appearance (Phase 4 B1, 0.42.0; saved loadouts B3, 0.44.0)
      description: |
        This route returns only the caller's own appearance, and only a session is needed. Before the caller
        has saved a loadout, source is starter_defaults (B1): the current starter configuration's item for each required slot
        and null for the optional slots; with no configuration yet, complete is false, starter_version is null and every slot
        is null. B3 (additive): loadout_version is 0 then. After a save, source is saved_loadout: the latest saved items'
        current catalog views, complete true, loadout_version the latest saved version, starter_version the configuration that
        save resolved defaults from (null if it needed none). A later default change does not alter a saved loadout.
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Appearance
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarAppearanceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/avatar/purchases:
    post:
      tags: [avatar]
      operationId: purchaseAvatarItem
      summary: Buy one paid avatar item with sunshine (Phase 4 B2, 0.43.0)
      description: |
        Sunshine only; flowers are never touched. One purchase per user per item; buying does not equip. The request names the
        catalog version the caller saw: another current version is AVATAR_VERSION_CONFLICT, an unlisted or starter item is
        AVATAR_ITEM_UNAVAILABLE, an item already bought is AVATAR_ALREADY_OWNED, too little sunshine is INSUFFICIENT_BALANCE;
        none of these writes anything. The server fingerprints the request. The same user, key and body replay with 200 and the
        ORIGINAL purchase facts, even after the item was repriced or unlisted; another request under the key is
        IDEMPOTENCY_KEY_REUSED. current is read now and is not the post-purchase state. Outside a couple: SPACE_NOT_FOUND, as
        the wallet. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarPurchaseRequest' }
      responses:
        '201':
          description: Bought
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarPurchaseResponse' }
        '200':
          description: Replayed original purchase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarPurchaseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'AVATAR_ITEM_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'AVATAR_VERSION_CONFLICT, AVATAR_ITEM_UNAVAILABLE, AVATAR_ALREADY_OWNED, INSUFFICIENT_BALANCE or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { description: 'RESULT_UNKNOWN; retry with the same key and body' }
  /api/v1/avatar/loadout:
    post:
      tags: [avatar]
      operationId: saveAvatarLoadout
      summary: Save the caller's whole six-slot loadout (Phase 4 B3, 0.44.0)
      description: |
        The caller comes only from the session; the caller must belong to a couple (SPACE_NOT_FOUND otherwise, as purchases).
        Each filled slot needs an item of that slot's category (AVATAR_SLOT_INVALID) that is a starter or the caller's own
        purchase (AVATAR_NOT_OWNED), listed or not; an unknown id is AVATAR_ITEM_NOT_FOUND. A null required slot takes the
        configured default; with no starter configuration that is AVATAR_DEFAULTS_UNAVAILABLE and nothing is saved.
        expected_version must be the current version (AVATAR_VERSION_CONFLICT otherwise). The server fingerprints the requested
        terms, not the resolved defaults: the same key and body replay with 200 and the original facts, even after a default
        changed; another request under the key is IDEMPOTENCY_KEY_REUSED. Never buys, never touches the wallet. Requires Origin
        and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarLoadoutRequest' }
      responses:
        '201':
          description: Saved
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarLoadoutResponse' }
        '200':
          description: Replayed original save
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarLoadoutResponse' }
        '400': { description: 'VALIDATION_ERROR or AVATAR_SLOT_INVALID' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'AVATAR_ITEM_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'AVATAR_VERSION_CONFLICT, AVATAR_NOT_OWNED, AVATAR_DEFAULTS_UNAVAILABLE or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { description: 'RESULT_UNKNOWN; retry with the same key and body' }
  /api/v1/avatar/owned:
    get:
      tags: [avatar]
      operationId: listOwnedAvatarItems
      summary: The caller's own paid items (Phase 4 B2, 0.43.0)
      description: |
        Only the caller's purchases, newest first by (purchase time, id), including items unlisted since. Starter items are not
        owned and never appear here; their availability is the catalog's starter flag. Each entry pairs the original purchase
        facts with today's catalog view of the item. Never another user's items, purchases, spending or balance. Outside a
        couple: SPACE_NOT_FOUND.
      security: [{ CookieSession: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Owned items
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarOwnedListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: SPACE_NOT_FOUND }

  /api/v1/achievements:
    get:
      tags: [achievements]
      operationId: getAchievements
      summary: The caller's five task badges, progress and first earned instants
      description: |
        Authenticated current-space member only. Read-only, no award or currency writes. Counts the caller's final
        task_completions in the current couple at or after the immutable, maintenance-enabled cutover. No historical
        backfill, progress increments or partner completions. Single/counted/recurring task occurrences each count only
        when finally completed. Streaks use distinct Asia/Shanghai dates and the historical longest run, so inactivity
        does not revoke an earned badge. Before explicit activation, enabled=false, enabled_at=null and all progress is 0.
        Same statement snapshot for every field. This does not disclose task ids, names or the partner's achievements.
      responses:
        '200':
          description: Badge snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: SPACE_NOT_FOUND }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/admin/v1/avatar/assets:
    get:
      tags: [admin]
      operationId: adminListAvatarAssets
      summary: The approved avatar asset registry (admin boundary only)
      description: Read-only. Assets are added by the maintenance role after art review; there is no upload endpoint.
      responses:
        '200':
          description: Registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarAssetList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/v1/avatar/items:
    get:
      tags: [admin]
      operationId: adminListAvatarItems
      summary: Every avatar item, listed or not, with its current revision
      description: Each item carries owner_count (0.43.0, additive), the number of paid owners; never who they are.
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarItemList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminCreateAvatarItem
      summary: Create an avatar item and its first revision, with an atomic audit record
      description: |
        The asset must be an unused registry family of the same category; one item per appearance family. category, starter
        and family never change afterwards. A starter item has price_sunshine null; a paid item 1-9999. The same admin,
        key and body replay with 200; a different body or another kind of write under the key is IDEMPOTENCY_KEY_REUSED.
        Admin writes need the admin surface, exact admin Origin, X-Requested-By and the admin session's X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAvatarItemCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarItemMutation' }
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarItemMutation' }
        '400': { description: 'VALIDATION_ERROR or AVATAR_ASSET_INVALID' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: IDEMPOTENCY_KEY_REUSED }
        '503': { description: 'RESULT_UNKNOWN; retry with the same key and body' }
  /api/admin/v1/avatar/items/{itemId}:
    get:
      tags: [admin]
      operationId: adminGetAvatarItem
      summary: One avatar item with every revision
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarItemDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: AVATAR_ITEM_NOT_FOUND }
  /api/admin/v1/avatar/items/{itemId}/revisions:
    post:
      tags: [admin]
      operationId: adminReviseAvatarItem
      summary: A new revision - rename, asset correction, price, list or unlist
      description: |
        expected_version must be the current version (AVATAR_VERSION_CONFLICT otherwise). The asset may stay or move to a later
        revision of the item's own family (a reviewed defect correction); another family or an earlier revision is
        AVATAR_ASSET_INVALID, because a different appearance must be a new item. A revision identical to the current one is
        VALIDATION_ERROR. Unlisting stops future purchases only. Replay and key rules as for creation.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAvatarItemRevisionRequest' }
      responses:
        '201':
          description: Revised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarItemMutation' }
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarItemMutation' }
        '400': { description: 'VALIDATION_ERROR or AVATAR_ASSET_INVALID' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: AVATAR_ITEM_NOT_FOUND }
        '409': { description: 'AVATAR_VERSION_CONFLICT or IDEMPOTENCY_KEY_REUSED' }
        '503': { description: 'RESULT_UNKNOWN; retry with the same key and body' }
  /api/admin/v1/avatar/starter:
    get:
      tags: [admin]
      operationId: adminGetAvatarStarter
      summary: The current starter configuration, or null
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarStarterResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminSetAvatarStarter
      summary: A new starter configuration naming one default per required slot
      description: |
        Each of hair, clothes and expression must name a starter item of that category (AVATAR_STARTER_INVALID otherwise).
        expected_version is the current version, 0 when none exists. Replay and key rules as for item creation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAvatarStarterRequest' }
      responses:
        '201':
          description: Configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarStarterMutation' }
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAvatarStarterMutation' }
        '400': { description: 'VALIDATION_ERROR or AVATAR_STARTER_INVALID' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'AVATAR_VERSION_CONFLICT or IDEMPOTENCY_KEY_REUSED' }
        '503': { description: 'RESULT_UNKNOWN; retry with the same key and body' }

  /api/v1/reminders:
    get:
      operationId: listReminderRules
      summary: The caller's own current reminder rules (P2-6)
      description: |
        Private to the caller: a partner's rules are never listed. One entry per configured target, disabled ones
        included. Pages use each target's first revision (immutable created_at and id), so a later change does
        not move an entry between pages. next_cursor is non-null whenever more entries exist; nothing is silently
        truncated. Every page states generation_enabled, the server's configuration status for in-app reminder generation.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: cursor, schema: { type: string }, description: 'Strict timestamp_uuid keyset cursor.' }
      responses:
        '200':
          description: One page; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderRuleList' }
        '400': { description: Invalid limit or cursor }
        '401': { description: Unauthenticated }
        '404': { description: SPACE_NOT_FOUND }
        '500': { description: Internal error }

  /api/v1/media/uploads:
    post:
      operationId: createMediaUpload
      summary: A grant to upload one image directly to private object storage (P3-1)
      description: |
        Bytes never pass through this API. The grant writes only an untrusted staging location and cannot be revoked once
        issued; nothing is readable until completion has copied and inspected it. A replay of the same key and body returns
        the same media, with a form only while the grant can still be used. With no object store configured this answers
        MEDIA_DISABLED, which is the state of every deployment until store guarantees are proved.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadRequest' }
      responses:
        '200':
          description: Replay; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '201':
          description: A new grant; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { description: VALIDATION_ERROR }
        '401': { description: Unauthenticated }
        '404': { description: SPACE_NOT_FOUND }
        '409': { description: IDEMPOTENCY_KEY_REUSED }
        '429': { description: MEDIA_LIMIT_EXCEEDED }
        '503': { description: 'MEDIA_DISABLED, or RESULT_UNKNOWN; retry with the same key and body' }

  /api/v1/media/uploads/{mediaId}/complete:
    post:
      operationId: completeMediaUpload
      summary: Copy the upload to a write-once location, inspect the copy, and decide (uploader only, P3-1)
      description: |
        Safe to retry. READY names the inspected copy, so later use of the grant cannot change what is read. A store outage
        is never a rejection. Rejected is terminal, and another try takes a new upload.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The decided state, ready or rejected; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '401': { description: Unauthenticated }
        '404': { description: MEDIA_NOT_FOUND, including another member's upload }
        '409': { description: 'MEDIA_NOT_UPLOADED, retryable; MEDIA_GRANT_EXPIRED, upload again' }
        '503': { description: 'MEDIA_DISABLED, MEDIA_STORE_UNAVAILABLE or RESULT_UNKNOWN; retryable' }

  /api/v1/memories:
    post:
      tags: [memories]
      operationId: createMemory
      summary: Create a photo memory (P3-1b)
      description: |
        D20 (0.41.0): optional notify_partner (default off, never remembered) creates at most one generic memory.created notice for the
        other member in the same transaction; the response carries the original decision as notification. A memory made by plan
        conversion never notifies.
        Either member creates and is its creator. date YYYY-MM-DD from 1900-01-01 to today in Beijing; title 1-60 code points
        (task-title rules); optional description 0-2000 code points (task-description rules); media_ids 1-9 distinct images in
        display order, each READY, uploaded by the caller and not attached elsewhere (MEMORY_PHOTO_UNAVAILABLE otherwise; nothing is
        saved). Attaching is permanent for that image: it stays with this memory's history and out of cleanup. Same actor/key and
        body replay with 200; a different body returns IDEMPOTENCY_KEY_REUSED. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemoryRequest' }
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }
    get:
      tags: [memories]
      operationId: listMemories
      summary: The space's timeline, newest memory date first
      description: |
        Pages by (current date DESC, created_at DESC, id DESC). A new memory never repeats or hides a row of a walk in progress. An
        edit that changes a memory's date moves that one memory, which a walk in progress may then show twice or not at all. Pass
        `next_cursor` back unchanged.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TaskCursor'
      responses:
        '200':
          description: One page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/memories/deletions:
    get:
      tags: [memories]
      operationId: listMemoryDeletions
      summary: The caller's own memory deletions that can be undone now (D6)
      description: |
        Newest first, by (deleted_at DESC, id DESC). Lists a deletion only while it is the caller's own, not undone, and strictly before its
        purge_after on the database clock. The partner sees none of them. It carries the current title, so the creator can tell them apart, and
        no description or photos. The answer is a snapshot, so undoing a listed deletion can still return MEMORY_UNDO_CLOSED. Pass `next_cursor` back unchanged.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TaskCursor'
      responses:
        '200':
          description: One page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeletionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: SPACE_NOT_FOUND }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/memories/{memoryId}/deletions:
    post:
      tags: [memories]
      operationId: deleteMemory
      summary: The creator deletes a memory (D6)
      description: |
        Starts one deletion cycle. From the commit every read of the memory answers MEMORY_NOT_FOUND for both members. Any pending edit proposal is
        rejected in the same transaction, releasing its reserved photos, and an undo does not restore it. A pending delete request is recorded as
        approved in the same transaction, naming this cycle, and an undo does not change that. In the same transaction, every photo the creator
        uploaded that is bound to this memory, including photos only its history holds, and not already deleted gets a linked cycle with this
        cycle's exact deleted_at and purge_after. After the deadline those photos' bytes are purged by the media job. The partner's photos are never
        touched: they stay under their uploader's control, and appear in listRetainedMedia. A cycle from before 0.35.0 has no linked cycles and
        gets none. All text and photo bytes stay until then. After the deadline, where MEMORY_PURGE_ENABLED is on, a job overwrites every title, description
        and text-derived request fingerprint of this memory for good. Its old keys then answer MEMORY_NOT_FOUND, whatever the request. Each photo's
        uploader keeps their own access, and nobody else reads it through this memory. The answer holds only the facts of this cycle, never text or
        photos. The same actor and key replay with 200 and that cycle as it is today, which does not say whether the memory is visible now. A different
        target: IDEMPOTENCY_KEY_REUSED. Already deleted, with a new key: MEMORY_ALREADY_DELETED for the creator, MEMORY_NOT_FOUND for the partner.
        The partner on a visible memory: MEMORY_EDIT_FORBIDDEN. Another space: MEMORY_NOT_FOUND. Takes no body. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Deleted
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeletionResponse' }
        '200':
          description: A same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeletionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'MEMORY_EDIT_FORBIDDEN, or Origin or CSRF refused' }
        '404': { description: 'MEMORY_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'MEMORY_ALREADY_DELETED or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/memories/{memoryId}/deletions/{deletionId}/undo:
    post:
      tags: [memories]
      operationId: undoMemoryDeletion
      summary: The original deleter undoes one exact deletion cycle (D6)
      description: |
        Allowed strictly before that cycle's purge_after, on the database clock: MEMORY_UNDO_CLOSED otherwise, including when the deadline passes
        while the request is being processed. A cycle already undone answers MEMORY_DELETION_NOT_ACTIVE for a new key, and a later cycle is not
        affected. It restores what the memory was, except an edit proposal rejected by the deletion, and undoes exactly this cycle's linked photo
        cycles, all or none: if any of them can no longer be undone the whole undo is MEMORY_UNDO_CLOSED and the memory stays deleted. A photo deleted
        independently stays deleted. The same actor and key replay with 200 and that
        cycle's facts, which say only that this cycle was undone: a later cycle may have deleted the memory again. A different target:
        IDEMPOTENCY_KEY_REUSED. Anyone else, another space, and a cycle of a different memory: MEMORY_NOT_FOUND. Takes no body. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: deletionId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Undone, or a same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeletionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'MEMORY_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'MEMORY_UNDO_CLOSED, MEMORY_DELETION_NOT_ACTIVE or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/memories/{memoryId}:
    get:
      tags: [memories]
      operationId: getMemory
      summary: One memory in its current state
      description: Both members. Anyone else gets the same MEMORY_NOT_FOUND as an absent memory, and so does everyone from the commit of a deletion until an undo.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Current state
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/memories/{memoryId}/revisions:
    post:
      tags: [memories]
      operationId: editMemory
      summary: The creator replaces the terms and photos against expected_version
      description: |
        Creator only (the partner gets MEMORY_EDIT_FORBIDDEN and proposes instead). Blocked while a proposal is pending
        (MEMORY_PROPOSAL_PENDING). expected_version must be current (MEMORY_VERSION_CONFLICT); the terms must differ
        (VALIDATION_ERROR). media_ids may keep this memory's images, in any order, and add the caller's own unattached READY images.
        An image no longer shown stays attached, for the earlier revision that still shows it.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryRevisionRequest' }
      responses:
        '201':
          description: Edited
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/memories/{memoryId}/delete-requests:
    post:
      tags: [memories]
      operationId: requestMemoryDeletion
      summary: The partner asks the creator to delete a memory (D6)
      description: |
        Changes nothing about the memory and carries no text. A memory has at most one pending request of either kind: an edit proposal or another
        delete request answers MEMORY_PROPOSAL_PENDING, and while this one is pending so do an edit proposal and the creator's direct edit. The creator:
        MEMORY_EDIT_FORBIDDEN. Another space, or a deleted memory: MEMORY_NOT_FOUND. The same actor and key replay with 200 and that request as it is
        today, even if the memory is gone since: the answer is about the request and does not say whether the memory is visible now. A different
        target: IDEMPOTENCY_KEY_REUSED. Takes no body. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Requested
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeleteRequestResponse' }
        '200':
          description: A same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeleteRequestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'MEMORY_EDIT_FORBIDDEN, or Origin or CSRF refused' }
        '404': { description: 'MEMORY_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'MEMORY_PROPOSAL_PENDING or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/memories/{memoryId}/delete-requests/{requestId}:
    get:
      tags: [memories]
      operationId: getMemoryDeleteRequest
      summary: One delete request and its status (D6)
      description: Both members, while the memory is visible. Anyone else, and everyone while it is deleted, gets the same MEMORY_PROPOSAL_NOT_FOUND as an absent request.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The request
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeleteRequestResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: MEMORY_PROPOSAL_NOT_FOUND }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/memories/{memoryId}/delete-requests/{requestId}/decision:
    post:
      tags: [memories]
      operationId: decideMemoryDeleteRequest
      summary: The creator approves or rejects; the requester withdraws (D6)
      description: |
        One decision per request; a later one gets MEMORY_PROPOSAL_DECIDED. Approval and a new deletion cycle commit together, or neither does, and the
        answer adds that cycle under `deletion` for the approver. Rejection and withdrawal leave the memory as it was, and the partner may ask again. An
        undo of the cycle changes no decision. The wrong member: MEMORY_EDIT_FORBIDDEN. A deleted memory, with a new key: MEMORY_NOT_FOUND. The same actor,
        key and outcome replay with 200 and the facts as they are today, which do not say whether the memory is visible now. A key already spent
        on another operation: IDEMPOTENCY_KEY_REUSED. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [approve, reject, withdraw] }
      responses:
        '200':
          description: Decided, or a same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDeleteRequestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'MEMORY_EDIT_FORBIDDEN, or Origin or CSRF refused' }
        '404': { description: 'MEMORY_NOT_FOUND, MEMORY_PROPOSAL_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'MEMORY_PROPOSAL_DECIDED or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/memories/{memoryId}/proposals:
    post:
      tags: [memories]
      operationId: proposeMemoryEdit
      summary: The partner proposes a full replacement against expected_version
      description: |
        Partner only. At most one pending proposal per memory. The proposer's new images are reserved, not attached: they stay out
        of cleanup and of any other memory, and the creator may view them. Approval attaches them, with the new revision, in one
        transaction. A rejection or withdrawal releases them: only the uploader sees them again, and the unattached period restarts
        from that decision.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryRevisionRequest' }
      responses:
        '201':
          description: Proposal created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMutationResponse' }
        '200':
          description: Same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }
    get:
      tags: [memories]
      operationId: listMemoryProposals
      summary: One memory's edit proposals, newest first (0.37.0)
      description: |
        Both members, while the memory is visible. Pending and decided proposals as summaries: no text, photos or object keys; read
        getMemoryProposal for the original and the suggestion. Pages by (created_at DESC, id DESC); proposals are immutable, so a walk
        never repeats or skips one. Pass `next_cursor` back unchanged. A decision is a historical fact: `approved_version` is the
