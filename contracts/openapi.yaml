        - 对方修改 403 PRODUCT_FORBIDDEN；已下架 409 PRODUCT_ARCHIVED；expected_version 过期 409 PRODUCT_VERSION_CONFLICT。
        - 同键同内容重放返回原修改的不可变事实（即使之后又被修改或下架）；product 为当前状态。
