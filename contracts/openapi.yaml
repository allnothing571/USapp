      type: object
      required: [id, state, activated_at, revoked_reason, revoked_at, current_session, provider, user_agent_family]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [active, inactive, revoked] }
        activated_at: { type: string, format: date-time }
        revoked_reason:
          type: [string, 'null']
          enum: [user, superseded, replaced, reowned, gone, null]
          description: gone means the push provider reported the subscription dead (P2-5b); it is not a user action.
