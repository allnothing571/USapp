              schema:
                $ref: '#/components/schemas/InviteListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [space]
      operationId: createSpaceInvite
      summary: 生成情侣邀请（调用者必须是空间成员）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [room_issuer_side]
              properties:
                room_issuer_side: { $ref: '#/components/schemas/RoomSide' }
      description: |
        - 邀请码明文只在创建响应中返回一次，数据库只保存 SHA-256。
        - 空间已满（2 名成员）时返回 409 `SPACE_FULL`。
      responses:
        '201':
          description: 创建成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/spaces/current/invites/{inviteId}:
    delete:
      tags: [space]
      operationId: revokeSpaceInvite
      summary: 撤销邀请（仅本空间成员）
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: 已撤销
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invites/{code}/preview:
    get:
      tags: [space]
      operationId: previewRoomInvitation
      summary: Show the recipient their room side before joining
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Available invitation for a caller without a space
          content:
            application/json:
              schema:
                type: object
                required: [room_side]
                properties:
                  room_side: { $ref: '#/components/schemas/RoomSide' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/invites/{code}/accept:
    post:
      tags: [space]
      operationId: acceptInvite
      summary: 接受邀请并加入情侣空间
      description: |
        必须在单个事务内完成：
        1. 以行锁（`SELECT ... FOR UPDATE`）读取未撤销、未过期、未用尽的邀请；
        2. 校验邀请所属空间未满；
        3. 校验调用者尚未加入任何空间；
        4. 插入 `couple_members`，slot 取该空间当前可用槽位（1 或 2）；
        5. 递增 `used_count` 并写入 `consumed_*`。
        任一步失败整体回滚；唯一约束冲突映射为 409。
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: 加入成功
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/v1/system/status:
    get:
      tags: [admin]
      operationId: getAdminSystemStatus
      security: [{ AdminCookieSession: [] }]
      summary: Authenticated read-only current-process configuration and recorded migration snapshot
      description: 'One SELECT of migration records; process settings are sampled before it. Not checksum verification, worker liveness, provider delivery, backup freshness or release readiness. No secrets, host paths, raw logs or operational writes. Existing AdminFilter and independent admin identity required.'
      responses:
        '200':
          description: No-store observation; database query succeeded
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Admin surface hidden from disallowed peers }
        '500': { description: Generic observation failure; no partial snapshot }

  /api/admin/v1/health:
    get:
      tags: [admin]
      operationId: getAdminHealth
