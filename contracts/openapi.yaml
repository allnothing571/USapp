          properties:
            result: { type: string, enum: [created, already_active] }
            generation_id: { type: string, format: uuid }
            recorded_at: { type: string, format: date-time }
        generation: { $ref: '#/components/schemas/PushGeneration' }
        marker:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: Opaque device marker, only while the generation is active for this session.

