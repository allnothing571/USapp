    get:
      operationId: listUndoableMediaDeletions
      summary: The caller's own photo deletions that can be undone now (D6)
      description: |
        Newest first, by (deleted_at DESC, id DESC). Lists a deletion only while it is the caller's own, not undone, not linked to a memory's deletion, strictly before its
        purge_after on the database clock, and with no committed purge plan. It adds the upload time and minimal context to tell the photos apart:
        never image bytes, a thumbnail, a signed URL, an object key, a filename, dimensions, a pending request, or anything of another member's.
        One read answers the page. The answer is a snapshot, so undoing a listed deletion can still return MEDIA_UNDO_CLOSED.
        Any session of the same account sees the same list. Pass `next_cursor` back unchanged.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TaskCursor'
      responses:
        '200':
          description: One page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UndoableMediaDeletionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: SPACE_NOT_FOUND }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/media/{mediaId}:
    get:
      operationId: getMedia
      summary: Facts about one image; never an object key (P3-1)
      description: The uploader always; the partner once it is ready and attached to a memory, for good, or while it is an active album photo, or while a pending proposal names it for review. Anyone else gets the same 404 as an absent image, and so does the partner from the commit of an album removal. From the commit of a deletion everyone gets that 404, the uploader included, until the deletion is undone.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '401': { description: Unauthenticated }
        '404': { description: MEDIA_NOT_FOUND }

  /api/v1/media/{mediaId}/content:
    get:
      operationId: getMediaContent
      summary: Redirect to a short-lived signed URL for the READY image (P3-1)
      description: |
        The signed URL stays usable until it expires, at most 10 minutes. It names only the validated object, never the upload location.
        Variants thumb and view are for anyone entitled to the image. The original can carry location data, so only its uploader may
        download it: anyone else gets the same 404 as an absent image.
        After a deletion commits, a request that starts answers 404 and no URL is signed, for the uploader too. A request already past its
        check when the deletion commits may still finish. A URL already issued cannot be recalled: it works until it expires or the object
        is purged, and copies already fetched stay where they are.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: variant, schema: { type: string, enum: [thumb, view, original], default: view } }
      responses:
        '302': { description: Redirect; no-store }
        '400': { description: VALIDATION_ERROR }
        '401': { description: Unauthenticated }
        '404': { description: 'MEDIA_NOT_FOUND, including anything not ready, or deleted' }
        '503': { description: MEDIA_DISABLED }

  /api/v1/media/{mediaId}/deletions:
    post:
      operationId: deleteMedia
      summary: The uploader deletes their own READY photo (D6)
      description: |
        Starts one deletion cycle: reads and new signed URLs stop at the commit, for everyone. The photo keeps its binding: an album hides it,
        and a memory keeps its position as a placeholder. The bytes stay until purge_after, seven days of database time later, then are
        purged by a background job, which cannot be undone. Works with no object store configured. A photo already deleted answers
        MEDIA_ALREADY_DELETED for a new key. The same actor and key replay with 200 and the original cycle's current facts: the deadline
        does not move and no later cycle is touched. A different target: IDEMPOTENCY_KEY_REUSED. The partner, another space, an absent id
        and anything not READY answer the same MEDIA_NOT_FOUND. Takes no body. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Deleted
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDeletionResponse' }
        '200':
          description: A same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDeletionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'MEDIA_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'MEDIA_ALREADY_DELETED or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/media/{mediaId}/deletions/{deletionId}/undo:
    post:
      operationId: undoMediaDeletion
      summary: The original deleter undoes one exact deletion cycle (D6)
      description: |
        Allowed strictly before that cycle's purge_after, on the database clock, and only while no purge plan has committed: MEDIA_UNDO_CLOSED
        otherwise, including when the deadline passes while the request is being processed. listUndoableMediaDeletions finds the id. Restores the photo's earlier access and its old places; it approves nothing. A cycle already undone answers
        MEDIA_DELETION_NOT_ACTIVE for a new key, and a later cycle of the same photo is not affected. The same actor and key replay with 200
        and that cycle's current facts. A different target: IDEMPOTENCY_KEY_REUSED. Anyone else, another space, and a cycle of a different
        photo answer the same MEDIA_NOT_FOUND. A cycle made by a memory's deletion is undone only with that memory: MEDIA_DELETION_LINKED. Takes no body. Requires Origin and CSRF.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: deletionId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Undone, or a same-key replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDeletionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'MEDIA_NOT_FOUND or SPACE_NOT_FOUND' }
        '409': { description: 'MEDIA_UNDO_CLOSED, MEDIA_DELETION_NOT_ACTIVE, MEDIA_DELETION_LINKED or IDEMPOTENCY_KEY_REUSED' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/tasks/{taskId}/reminder:
    post:
      operationId: setTaskReminder
      summary: Replace the caller's own reminder rule on a root task (assignee only, P2-6)
      description: |
        Appends one immutable rule revision. Bounds: daily before_minutes 1-1440 and days_before 0; weekly
        before_minutes 1-10080 and days_before 0-6; custom before_minutes 1-10080 and days_before 0-6, with the
        instant inside the range; one-off with a deadline before_minutes 1-10080 and days_before 0-7; one-off
        without a deadline only mode absolute. A recurring task's id is its root: a period id is refused.
        Disabling sends exactly {"enabled": false}. It stays possible when the instant has passed or the task is
        completed or expired; a cancelled or superseded task takes no more writes (REMINDER_TARGET_CLOSED).
        A same-key replay returns the original immutable facts in mutation and today's state in current, appending
        nothing. An identical re-save appends a revision and does not reset effective_at; disabling breaks the run.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskReminderRequest' }
      responses:
        '201':
          description: Revision appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderRuleResponse' }
        '200':
          description: Same-key replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderRuleResponse' }
        '400': { description: VALIDATION_ERROR or REMINDER_TIME_INVALID }
        '401': { description: Unauthenticated }
        '403': { description: REMINDER_NOT_ASSIGNEE }
        '404': { description: 'SPACE_NOT_FOUND, or TASK_NOT_FOUND for an absent task or another space' }
        '409': { description: 'REMINDER_TARGET_CLOSED, REMINDER_TIME_PASSED or IDEMPOTENCY_KEY_REUSED' }
        '503': { description: RESULT_UNKNOWN; retry with the same key and body }

  /api/v1/anniversaries/{anniversaryId}/reminder:
    post:
      operationId: setAnniversaryReminder
      summary: Replace the caller's own reminder rule on an anniversary (each member for themselves, P2-6)
      description: |
        days_before holds 1 to 3 distinct values from 0, 1, 3, 7, 14, 30; at_time defaults to 09:00, Beijing time.
        Disabling sends exactly {"enabled": false}. Replay and revision rules are as for tasks; effective time is per
        offset, so changing one offset does not reset another.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: anniversaryId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnniversaryReminderRequest' }
      responses:
        '201':
          description: Revision appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderRuleResponse' }
        '200':
          description: Same-key replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderRuleResponse' }
        '400': { description: VALIDATION_ERROR }
        '401': { description: Unauthenticated }
        '404': { description: 'SPACE_NOT_FOUND, or ANNIVERSARY_NOT_FOUND for an absent item or another space' }
        '409': { description: IDEMPOTENCY_KEY_REUSED }
        '503': { description: RESULT_UNKNOWN; retry with the same key and body }

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: Read the caller's recipient-private in-app inbox
      security: [{ CookieSession: [] }]
      description: Mandatory events (P2-3a) and optional partner notices chosen by the sender (P2-3b). Pages are not snapshots; refresh from the head for new commits. No personal message or note text is included.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: cursor, schema: { type: string }, description: 'Strict timestamp_uuid keyset cursor on immutable created_at/id.' }
        - { in: query, name: unread_only, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Inbox page; response is private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '400': { description: Invalid limit, cursor or filter }
        '401': { description: Unauthenticated }
        '500': { description: Internal error }

  /api/v1/notification-choices:
    get:
      operationId: getNotificationChoices
      summary: The caller's remembered ordinary-notification defaults (P2-3b)
      description: |
        For each of the five ordinary operations, the caller's latest EXPLICIT choice made with a
        partner present (seq = its sequence); enabled false and seq null when none is remembered.
        Omitted choices and partnerless writes never change these defaults. Mandatory notices
        cannot be disabled. Read only; private and no-store.
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Remembered defaults
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [choices]
                properties:
                  choices:
                    type: object
                    additionalProperties: false
                    required: [task_publish, anniversary_create, anniversary_edit, message_create, message_reply]
                    properties:
                      task_publish: { $ref: '#/components/schemas/NotificationChoice' }
                      anniversary_create: { $ref: '#/components/schemas/NotificationChoice' }
                      anniversary_edit: { $ref: '#/components/schemas/NotificationChoice' }
                      message_create: { $ref: '#/components/schemas/NotificationChoice' }
                      message_reply: { $ref: '#/components/schemas/NotificationChoice' }
        '401': { description: Unauthenticated }
        '404': { description: SPACE_NOT_FOUND }
        '500': { description: Internal error }

  /api/v1/notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      summary: Exact unread count for the caller
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: One current database snapshot; private and no-store
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '500': { description: Internal error }

  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one of the caller's notifications read
      description: Naturally idempotent by notificationId. Retrying returns the original immutable receipt; no Idempotency-Key required. Exact Origin and session CSRF required. Unknown outcomes are retried against the same id. No mark-all-read.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: notificationId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
        - { in: header, name: Origin, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200':
          description: Confirmed read receipt; private and no-store
          content:
            application/json:
              schema:
                type: object
                required: [receipt]
                properties:
                  receipt:
                    type: object
                    required: [notification_id, read_at]
                    properties:
                      notification_id: { type: string, format: uuid }
                      read_at: { type: string, format: date-time }
        '400': { description: Invalid body }
        '401': { description: Unauthenticated }
        '403': { description: Origin or CSRF rejection }
        '404': { description: NOT_FOUND; absent, other recipient or other space }
        '500': { description: Confirmed failure }
        '503': { description: RESULT_UNKNOWN; retry the same notification }

  /api/v1/push/config:
    get:
      operationId: getPushConfig
      summary: P2-5a Web Push availability for this server
      description: subscribe_available is false unless PUSH_SUBSCRIBE_ENABLED=true, a valid VAPID public key is configured AND a push transport exists. P2-5a has no transport, so it is always false. Formal session required. Private and no-store.
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Push configuration; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushConfig' }
        '401': { description: Unauthenticated }

  /api/v1/push/subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: The caller's device subscription generations, without endpoints or keys
      description: |
        Formal session and space membership required. `devices` is COMPLETE: every generation
        that occupies a cap slot (unrevoked, session valid, any key id; at most 10 by the
        database guard), so absence from `devices` means the generation occupies no slot. Its
        state is `active` (configured key) or `inactive` (old key, still occupying a slot).
        `history` is bounded to the newest 20 other generations (revoked or session ended) and
        never displaces a device. `occupied_slots` equals the length of `devices`.
      security: [{ CookieSession: [] }]
      responses:
        '200':
          description: Devices and bounded history; private and no-store
          content:
            application/json:
              schema:
                type: object
                required: [devices, history, occupied_slots, device_limit]
                properties:
                  devices:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/PushGeneration' }
                  history:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/PushGeneration' }
                  occupied_slots: { type: integer, minimum: 0, maximum: 10 }
                  device_limit: { type: integer, const: 10 }
        '401': { description: Unauthenticated }
        '404': { description: SPACE_NOT_FOUND }
        '500': { description: Internal error }
    post:
      operationId: registerPushSubscription
      summary: Register this browser's push subscription for the current session (P2-5a, gated)
      description: |
        Exact Origin and session CSRF required; Idempotency-Key required. Every accepted key is
        recorded with its ORIGINAL result (created | already_active). A same-key replay returns
        those command facts plus the generation's CURRENT state and never creates, revokes or
        restores a generation; the same key with a different request (including another session)
        is IDEMPOTENCY_KEY_REUSED. A new device at 10 counted devices is rejected with
        PUSH_DEVICE_LIMIT; no other device is revoked. Re-registering the same endpoint replaces
        it (superseded / replaced / reowned) in one transaction. Body at most 4 KB. While
        subscribe_available is false the answer is 409 PUSH_UNAVAILABLE. The marker is returned
        only for an active generation.
      security: [{ CookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
        - { in: header, name: Origin, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRegistrationRequest' }
      responses:
        '201':
          description: A new generation was created; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushRegistrationResponse' }
        '200':
          description: already_active, or a same-key replay; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushRegistrationResponse' }
        '400': { description: VALIDATION_ERROR (key, body, endpoint allowlist or key material) }
        '401': { description: Unauthenticated }
        '403': { description: Origin or CSRF rejection }
        '404': { description: SPACE_NOT_FOUND }
        '409': { description: PUSH_UNAVAILABLE, PUSH_DEVICE_LIMIT or IDEMPOTENCY_KEY_REUSED }
        '500': { description: Confirmed failure }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/push/subscriptions/{generationId}/revoke:
    post:
      operationId: revokePushSubscription
      summary: Revoke one of the caller's subscription generations
      description: Naturally idempotent by generationId; no Idempotency-Key. A retry, or a generation already revoked by a successor, returns the original revocation and touches no other generation. Exact Origin and session CSRF required. Another user's or an unknown generation is PUSH_SUBSCRIPTION_NOT_FOUND.
      security: [{ CookieSession: [] }]
      parameters:
        - { in: path, name: generationId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
        - { in: header, name: Origin, required: true, schema: { type: string } }
      responses:
        '200':
          description: The (original) revocation and the generation's current state; private and no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushRevocationResponse' }
        '401': { description: Unauthenticated }
        '403': { description: Origin or CSRF rejection }
        '404': { description: SPACE_NOT_FOUND or PUSH_SUBSCRIPTION_NOT_FOUND }
        '500': { description: Confirmed failure }
        '503': { $ref: '#/components/responses/ResultUnknown' }

  /api/v1/shared-plans:
    get:
      operationId: listSharedPlans
      parameters: [{"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100}},{"name":"cursor","in":"query","required":false,"schema":{"type":"string"}}]
      responses:
        '200': {"description":"Shared plan data","content":{"application/json":{"schema":{"type":"object","required":["plans","next_cursor"],"properties":{"plans":{"type":"array","items":{"$ref":"#/components/schemas/SharedPlan"}},"next_cursor":{"anyOf":[{"type":"string"},{"type":"null"}]}},"additionalProperties":false}}}}
        '400': {"description":"Invalid request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '401': {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '403': {"description":"Forbidden or invalid request origin or CSRF token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
        '404': {"description":"Plan or proposal unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorEnvelope"}}}}
    post:
