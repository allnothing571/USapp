        outcome: { type: string, enum: [approve, reject, withdraw] }

    AnniversaryPinRequest:
      type: object
      additionalProperties: false
      required: [anniversary_id]
      properties:
        anniversary_id:
          oneOf:
            - { type: string, format: uuid }
            - type: 'null'

    AnniversaryComputed:
      type: object
      description: Against as_of_date. An anniversary has days_since and next; a countdown has days_until.
      required: [days_since, next, days_until]
      properties:
        days_since: { type: [integer, 'null'], description: 'as_of_date - date; negative before the date' }
        next:
          oneOf:
            - type: object
              required: [date, years, days_until]
              properties:
                date: { type: string, format: date, description: 'May lie beyond 2199' }
                years: { type: integer, minimum: 0 }
                days_until: { type: integer, minimum: 0 }
            - type: 'null'
        days_until: { type: [integer, 'null'], description: 'date - as_of_date; negative once passed' }

    AnniversaryProposal:
      type: object
      required: [id, proposer_id, base_version, title, date, kind, note, created_at]
      properties:
        id: { type: string, format: uuid }
        proposer_id: { type: string, format: uuid }
        base_version: { type: integer, minimum: 1 }
        title: { type: string }
        date: { type: string, format: date }
        kind: { type: string, enum: [anniversary, countdown] }
        note: { type: string }
        created_at: { type: string, format: date-time }

    AnniversaryDecision:
      type: object
      required: [proposal_id, proposer_id, outcome, decided_by, decided_at]
      properties:
        proposal_id: { type: string, format: uuid }
        proposer_id: { type: string, format: uuid }
        outcome: { type: string, enum: [approved, rejected, withdrawn] }
        decided_by: { type: string, format: uuid }
        decided_at: { type: string, format: date-time }

    Anniversary:
      type: object
      additionalProperties: false
      required: [id, creator_id, version, title, date, kind, note, created_at, updated_at, pinned_by_me,
                 computed, pending_proposal, last_decision]
      properties:
        id: { type: string, format: uuid }
        creator_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 40 }
        date: { type: string, format: date }
        kind: { type: string, enum: [anniversary, countdown] }
        note: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pinned_by_me: { type: boolean }
        computed: { $ref: '#/components/schemas/AnniversaryComputed' }
        pending_proposal:
          oneOf:
            - $ref: '#/components/schemas/AnniversaryProposal'
            - type: 'null'
        last_decision:
          oneOf:
            - $ref: '#/components/schemas/AnniversaryDecision'
            - type: 'null'

    AnniversaryMutation:
      type: object
      description: |
        Immutable facts of one write; identical on same-key replay. action create, edit or approve
        is a revision (anniversary_id, version, actor_id, proposal_id, terms); propose carries
        proposal_id, proposer_id, base_version and the terms; decide carries proposal_id, outcome,
        decided_by, base_version and version (the approved version, otherwise null).
      required: [action, anniversary_id]
      properties:
        action: { type: string, enum: [create, edit, approve, propose, decide] }
        anniversary_id: { type: string, format: uuid }
        version: { type: [integer, 'null'] }
        actor_id: { type: string, format: uuid }
        proposal_id: { type: [string, 'null'], format: uuid }
        proposer_id: { type: string, format: uuid }
        base_version: { type: integer }
        outcome: { type: string, enum: [approved, rejected, withdrawn] }
        decided_by: { type: string, format: uuid }
        decided_at: { type: string, format: date-time }
        title: { type: string }
        date: { type: string, format: date }
        kind: { type: string, enum: [anniversary, countdown] }
        note: { type: string }
        created_at: { type: string, format: date-time }

    AnniversaryMutationResponse:
      type: object
      additionalProperties: false
      required: [mutation, as_of_date, anniversary]
      properties:
        mutation: { $ref: '#/components/schemas/AnniversaryMutation' }
        as_of_date: { type: string, format: date }
        anniversary: { $ref: '#/components/schemas/Anniversary' }
        notification:
          description: Present on create and creator direct edit only (P2-3b).
          $ref: '#/components/schemas/OptionalNotificationResult'

    AnniversaryResponse:
