            reason: { type: string, enum: [user, superseded, replaced, reowned, gone] }
            revoked_by:
              type: [string, 'null']
              format: uuid
              description: Null exactly when the reason is gone (provider attribution, no human actor).
            revoked_at: { type: string, format: date-time }
        generation: { $ref: '#/components/schemas/PushGeneration' }

