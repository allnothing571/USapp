N_STATE_CONFLICT, WALLET_BALANCE_LIMIT, IDEMPOTENCY_KEY_REUSED"}, "500": {"description": "INTERNAL_ERROR; preserve uncertain command"}, "503": {"description": "RESULT_UNKNOWN; preserve exact key/body"}}}}

components:
  securitySchemes:
    AdminCookieSession:
      type: apiKey
      in: cookie
      name: __Host-usapp-admin
      description: Independent admin session; all writes also require exact admin Origin, X-Requested-By and session CSRF.
    CookieSession:
      type: apiKey
      in: cookie
      name: __Host-usapp-session
      description: 会话 Cookie；状态修改请求同时必须携带 X-CSRF-Token 与匹配 Origin。

  headers:
    NoStore:
      description: 所有 API 响应强制 no-store
      schema:
        type: string
        const: no-store, no-cache, must-revalidate
    SetSessionCookie:
      description: __Host- 前缀要求 Secure + Path=/ + 无 Domain
      schema:
        type: string
        examples:
          - '__Host-usapp-session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Lax'
    ClearSessionCookie:
      schema:
        type: string
        examples:
          - '__Host-usapp-session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0'

  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 12, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskView:
      name: view
      in: query
      required: true
      schema: { type: string, enum: [open, history] }
    TaskCursor:
      name: cursor
      in: query
      description: 上一页响应的 `next_cursor`，原样回传；不透明。
      schema: { type: string, maxLength: 512 }
    AnniversaryId:
      name: anniversaryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 每次发布动作一个随机值（建议 UUID）；只在重试同一次发布时复用。
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    Query:
      name: query
      in: query
      schema: { type: string, maxLength: 128 }

  responses:
    BadRequest:
      description: 参数校验失败
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 请求参数不合法
    Unauthenticated:
      description: 未认证或会话已失效 / 验证码错误
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Origin / CSRF / 白名单 / 管理访问来源校验失败
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            csrf:
              value:
                error:
                  code: CSRF_TOKEN_INVALID
                  message: CSRF 令牌校验失败
            origin:
              value:
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: 请求来源不被允许
            whitelist:
              value:
                error:
                  code: REGISTRATION_NOT_ALLOWED
                  message: 该邮箱不在注册白名单内
    NotFound:
      description: 资源不存在（或无权限，故意不区分）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态冲突（空间已存在 / 空间已满 / 已在其他空间 / 邀请已被使用）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务内部错误（细节只写日志）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResultUnknown:
      description: 提交结果无法确认（RESULT_UNKNOWN）；使用同一个 Idempotency-Key 重试
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 触发冷却或频率限制
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

