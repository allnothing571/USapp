            properties:
              layers: { type: object, additionalProperties: { type: string, pattern: '^[0-9a-f]{64}$' }, description: Layer name to SHA-256 of its bundled file. }
              item_id: { type: [string, 'null'], format: uuid, description: The item bound to this family, if any. }
    AdminAvatarItemCreateRequest:
      type: object
      additionalProperties: false
      required: [category, starter, name, asset_key, price_sunshine, listed]
      properties:
        category: { type: string, enum: [hair, clothes, expression, hat, handheld, accessory] }
        starter: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 20 }
        asset_key: { type: string }
        price_sunshine: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        listed: { type: boolean }
    AdminAvatarItemRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, name, asset_key, price_sunshine, listed]
      properties:
        expected_version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 20 }
        asset_key: { type: string }
        price_sunshine: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        listed: { type: boolean }
    AdminAvatarItemMutation:
      type: object
      required: [replayed, revision_version, item]
      properties:
        replayed: { type: boolean }
        revision_version: { type: integer, minimum: 1, description: The revision this request wrote (the original one on replay). }
        item: { $ref: '#/components/schemas/AdminAvatarItem' }
    AdminAvatarStarter:
      type: object
      required: [version, hair, clothes, expression, admin_user_id, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        hair: { type: string, format: uuid }
